      operationId: revealDocumentField
      summary: Show one full number, recorded
      description: 'HR only. Returns the full ID number or account number of one document, and only after the audit event

        `document.field_shown` (who, which number, whose document, when) was accepted by the audit bus. If the event cannot

        be recorded no number is returned. Two calls make two events. The event never holds the number.

