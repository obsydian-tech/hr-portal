openapi: "3.0.3"

info:
  title: Naleko HR Portal API
  version: "1.0.0"
  contact:
    name: Naleko Engineering
  description: |
    REST API powering the Naleko employee-onboarding HR Portal.

    Two API Gateways deployed in af-south-1 (Cape Town):

    | Gateway | API ID | Handles |
    |---|---|---|
    | Employees | ndksa9ec0k | Employee records, Swagger UI, OpenAPI spec |
    | Documents | b2wt303fc8 | Document upload, OCR verifications, AI risk assessment |

    Authentication: all endpoints require a Cognito ID token unless marked public.
    Authorization: Bearer <id_token>
    Identity and role are derived from JWT claims only (sub + cognito:groups). No custom headers.

    Roles:
    - hr-partners: create employees, review docs, assess risk for their employees
    - hr-managers: same plus full visibility across all employees and verifications

    POPIA: all data stays in af-south-1. No PII leaves South Africa.
    Bedrock AI calls use cross-region inference profiles via AWS infrastructure only.

    Interactive docs: GET https://ndksa9ec0k.execute-api.af-south-1.amazonaws.com/docs

servers:
  - url: https://ndksa9ec0k.execute-api.af-south-1.amazonaws.com
    description: Employees API
  - url: https://b2wt303fc8.execute-api.af-south-1.amazonaws.com
    description: Documents and Verifications API

tags:
  - name: Employees
    description: Create and manage employee records
  - name: Documents
    description: Upload documents and generate pre-signed S3 URLs
  - name: Verifications
    description: OCR results, HR review workflow, and AI risk assessment
  - name: Docs
    description: Swagger UI and raw OpenAPI spec (no auth required)

components:
  securitySchemes:
    CognitoJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito User Pool ID token from InitiateAuth / RespondToAuthChallenge.

  schemas:

    EmployeeCreate:
      type: object
      required: [first_name, last_name, email, phone, department]
      description: Fields required to register a new employee.
      properties:
        first_name:
          type: string
          example: Sarah
        middle_name:
          type: string
        last_name:
          type: string
          example: Dlamini
        email:
          type: string
          format: email
          example: sarah.dlamini@example.com
        phone:
          type: string
          example: "+27821234567"
        department:
          type: string
          example: Finance
        job_title:
          type: string
          example: Senior Accountant
        offer_accept_date:
          type: string
          format: date
          example: "2026-04-01"
        planned_start_date:
          type: string
          format: date
          example: "2026-05-01"
        id_number:
          type: string
          pattern: '^[0-9]{13}$'
          description: Optional South African ID number, 13 digits with a valid date and check digit. Kept encrypted; only the last four digits are stored in clear.
        hr_staff_id:
          type: string
          example: HR-00042
          description: The id of a member of the hr_staff group, as GET /v1/hr-partners lists it. The partner's name and email are taken from the pool, not from the request.
        hr_staff_name:
          type: string
          example: Thabo Mokoena
          description: Ignored when hr_staff_id is sent.
        hr_staff_email:
          type: string
          format: email
          example: thabo@naleko.co.za
          description: Ignored when hr_staff_id is sent.

    Employee:
      type: object
      description: Full employee record.
      properties:
        employee_id:
          type: string
          example: EMP-0000014
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        department:
          type: string
        job_title:
          type: string
        stage:
          type: string
          enum: [INVITED, ACTIVE, DOCUMENTS_SUBMITTED, VERIFIED, TRAINING, ONBOARDED]
          description: |
            The stored stage of the old app. Kept next to `step` for the old app until OPS-04 switches it off;
            new screens read `step`.
        step:
          type: string
          nullable: true
          enum: [INVITED, DOCUMENTS, IN_REVIEW, VERIFIED, null]
          description: |
            Where the person is in onboarding. INVITED: added by HR, has not signed in yet.
            DOCUMENTS: signed in, and at least one required document is not in yet or was sent back.
            IN_REVIEW: every required document is in and HR has not accepted all of them.
            VERIFIED: HR has accepted every required document.
            Rows written before the step existed answer from their stage; null when the stage is not one of the
            six stored values.
        offer_accept_date:
          type: string
          format: date
        planned_start_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: Cognito sub of the HR staff member who registered this employee.
        hr_staff_id:
          type: string
        hr_staff_name:
          type: string
        hr_staff_email:
          type: string
          format: email
        riskBand:
          type: string
          enum: [LOW, MEDIUM, HIGH, UNKNOWN]
          nullable: true
          description: AI-assessed onboarding risk. Null until assess-risk is called.
        riskReason:
          type: string
          nullable: true
          description: One-sentence explanation from the AI model for the risk band.
        riskAssessedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent risk assessment.

    Document:
      type: object
      description: A document uploaded by an employee during onboarding.
      properties:
        document_id:
          type: string
          example: doc_1774086521598
        document_type:
          type: string
          enum: [NATIONAL_ID, BANK_CONFIRMATION, QUALIFICATION]
        file_name:
          type: string
        uploaded_at:
          type: string
          format: date-time
        ocr_status:
          type: string
          enum: [PENDING, PASSED, MANUAL_REVIEW, FAILED]
          description: "PENDING: OCR in progress. PASSED: approved. MANUAL_REVIEW: awaiting HR. FAILED: rejected, employee must re-upload."
        ocr_completed_at:
          type: string
          format: date-time
          nullable: true
        can_reupload:
          type: boolean
          description: True when status is FAILED and the employee may submit a replacement.
        verification:
          $ref: "#/components/schemas/VerificationSummary"
          nullable: true

    EmployeeDocument:
      description: |
        A document as GET /v1/employees/{id}/verifications answers it: the stored document plus
        the check and HR's decision, worked out by the Lambda so every reader gets one answer.
      allOf:
        - $ref: "#/components/schemas/Document"
        - type: object
          properties:
            document_type:
              type: string
              enum: [NATIONAL_ID, BANK_CONFIRMATION, MATRIC_CERTIFICATE, TERTIARY_QUALIFICATION]
            check:
              type: string
              enum: [READING, MATCHES, NEEDS_A_LOOK, DOESNT_MATCH]
              description: |
                READING: the file is still being read. MATCHES: a verification at 90% confidence or more.
                NEEDS_A_LOOK: under 90%, or the file could not be read. DOESNT_MATCH: reserved for ONB-07.
            hr_decision:
              type: string
              nullable: true
              enum: [ACCEPTED, NEW_ONE_ASKED, null]
              description: Null until HR decides. Told apart by hr_reviewed_at, because HR's decision overwrites ocr_status.
            hr_decided_at:
              type: string
              format: date-time
              nullable: true
              description: When HR decided, or null.

    WaitingDocuments:
      type: object
      description: Documents waiting for an HR decision (ONB-13), oldest first.
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              document_id:
                type: string
              employee_id:
                type: string
              employee_name:
                type: string
              document_type:
                type: string
              check:
                type: string
                enum: [READING, MATCHES, NEEDS_A_LOOK, DOESNT_MATCH]
              arrived_at:
                type: string
                format: date-time
                nullable: true
        count:
          type: integer
          description: Every waiting document, not one page.
        counts:
          type: object
          properties:
            READING:
              type: integer
            MATCHES:
              type: integer
            NEEDS_A_LOOK:
              type: integer
            DOESNT_MATCH:
              type: integer

    VerificationSummary:
      type: object
      description: Condensed OCR result used in list views and embedded in Document records.
      properties:
        verification_id:
          type: string
          example: ver_1774086781234
        employee_id:
          type: string
          example: EMP-0000014
        employee_name:
          type: string
          example: Sarah Dlamini
        document_type:
          type: string
          enum: [NATIONAL_ID, BANK_CONFIRMATION, QUALIFICATION]
        document_id:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 100
          example: 95
          description: OCR confidence score as a percentage (0-100).
        decision:
          type: string
          enum: [PASSED, FAILED, MANUAL_REVIEW]
          description: "PASSED: accepted. FAILED: rejected. MANUAL_REVIEW: below confidence threshold, awaiting HR."
        created_at:
          type: string
          format: date-time

    VerificationDetail:
      allOf:
        - $ref: "#/components/schemas/VerificationSummary"
      description: Full verification record including OCR reasoning and extracted fields.
      properties:
        reasoning:
          type: string
          description: OCR model explanation for why the document passed, failed, or needs review.
        id_number:
          type: string
        name:
          type: string
        surname:
          type: string
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
        citizenship:
          type: string
        account_holder:
          type: string
        bank_name:
          type: string
        account_number:
          type: string
        branch_code:
          type: string
        account_type:
          type: string
        institution:
          type: string
        qualification_name:
          type: string
        graduation_year:
          type: string

    ReviewRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [PASSED, FAILED]
          description: PASSED approves the document. FAILED rejects it and allows re-upload.
        notes:
          type: string
          maxLength: 500
          example: The photo is too dark to read.
          description: The reason for FAILED, at most 500 characters. The page asks for one.
        employee_id:
          type: string
          description: The document's employee. When given, the document is read with one GetItem instead of a Scan.

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        missing:
          type: array
          items:
            type: string
          description: Required fields that were absent (400 responses only).

security:
  - CognitoJWT: []

paths:
  /v1/invites/lookup:
    post:
      tags: [Invites]
      operationId: lookupInvite
      summary: Look up an invite link (public, ONB-04)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: The state of the link. invalid carries no other field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, expired, used, invalid]
                  company:
                    type: string
                  firstName:
                    type: string
                  email:
                    type: string
                  startDate:
                    type: string
                  hrPartnerName:
                    type: string
        "400":
          description: The body is missing or not JSON.
  /v1/invites/redeem:
    post:
      tags: [Invites]
      operationId: redeemInvite
      summary: Set the password with an invite link (public, ONB-04)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
      responses:
        "204":
          description: The password is set; the link is used.
        "400":
          description: The body is missing, or the password breaks a rule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  fields:
                    type: object
                    properties:
                      password:
                        type: array
                        items:
                          type: string
                          enum: [minLength, maxLength, lower, upper, number, symbol]
        "410":
          description: The link is expired, used or invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [expired, used, invalid]
        "502":
          description: Cognito could not set the password; the link still works.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  # =========================================================================
  # EMPLOYEES API  (ndksa9ec0k)
  # =========================================================================

  /v1/employees/lookup:
    get:
      tags: [Employees]
      operationId: lookupEmployeeEmail
      summary: Resolve an Employee ID to an email address
      description: |
        Public - no auth required.
        Used by the login screen so an employee can find their email before sign-in.
      security: []
      parameters:
        - name: employeeId
          in: query
          required: true
          schema:
            type: string
            example: EMP-0000014
      responses:
        "200":
          description: Email resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    format: email
        "400":
          description: Missing or malformed employee ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No employee found with that ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: List employees visible to the calling HR staff member
      description: |
        Returns employees managed by the caller (scoped to their Cognito sub).
        Members of hr-managers see all employees regardless.
      parameters:
        - name: stage
          in: query
          required: false
          schema:
            type: string
            enum: [INVITED, DOCUMENTS_SUBMITTED, MANUAL_REVIEW, VERIFIED]
        - name: department
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: List of employee records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Employee"
                  count:
                    type: integer
        "401":
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags: [Employees]
      operationId: createEmployee
      summary: Register a new employee and trigger onboarding
      description: |
        Creates an employee record in DynamoDB, provisions a Cognito account with
        a temporary password, and sends a welcome email via Postmark.
        Employee created in INVITED stage. ID auto-generated as EMP-NNNNNNN.
        HR staff identity comes from the JWT sub claim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeCreate"
      responses:
        "201":
          description: Employee created and welcome email sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Employee created successfully
                  employee:
                    $ref: "#/components/schemas/Employee"
                  cognito:
                    type: object
                    properties:
                      userCreated:
                        type: boolean
                      tempPassword:
                        type: string
                        nullable: true
                        description: Returned once at creation only. Not persisted - store securely.
                  email:
                    type: object
                    properties:
                      sent:
                        type: boolean
                      skipped:
                        type: string
                        enum: [test]
                  invite:
                    type: object
                    description: pepla-dev test logins only.
                    properties:
                      link:
                        type: string
        "400":
          description: The body is missing or not valid, or a field is wrong. `fields` names each wrong field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  missing:
                    type: array
                    items:
                      type: string
                  fields:
                    type: object
                    additionalProperties:
                      type: string
        "401":
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not in the hr_staff group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An employee with this email already exists (any capitals). Code DUPLICATE_EMAIL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/hr-partners:
    get:
      tags: [Employees]
      operationId: getHrPartners
      summary: List the HR staff who can be an employee's HR partner
      description: HR only. Every member of the hr_staff group, sorted by name.
      responses:
        "200":
          description: The HR partners.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: What createEmployee accepts as hr_staff_id.
                        name:
                          type: string
                        staffId:
                          type: string
                        email:
                          type: string
        "401":
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not in the hr_staff group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/employees/email-check:
    get:
      tags: [Employees]
      operationId: checkEmployeeEmail
      summary: Ask whether an email is already in use
      description: HR only. Capitals and spaces around the address do not matter. Answers inUse and nothing else.
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Whether the email is in use.
          content:
            application/json:
              schema:
                type: object
                properties:
                  inUse:
                    type: boolean
        "400":
          description: The email is missing or not an email address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not in the hr_staff group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/employees/by-email:
    get:
      tags: [Employees]
      operationId: getEmployeeByEmail
      summary: Look up an employee by email address
      description: Returns the full employee record for the given email address.
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Employee found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Missing or invalid email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No employee with that email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # =========================================================================
  # DOCUMENTS AND VERIFICATIONS API  (b2wt303fc8)
  # =========================================================================

  /v1/employees/{id}/verifications:
    get:
      tags: [Verifications]
      operationId: getEmployeeDocumentVerifications
      summary: Get all documents and verifications for a specific employee
      description: |
        Returns the employee with their full document list. Each document includes
        its OCR verification result (if complete) and a can_reupload flag.
        Also returns a status count: { total, passed, manual_review, failed }.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: EMP-0000014
      responses:
        "200":
          description: Employee with documents and verifications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee:
                    $ref: "#/components/schemas/Employee"
                  documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmployeeDocument"
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                      passed:
                        type: integer
                      manual_review:
                        type: integer
                      failed:
                        type: integer
                  required_documents:
                    type: array
                    description: |
                      The document types HR must accept before the employee is Verified, for the employee's company.
                      Today every company gets NATIONAL_ID and BANK_CONFIRMATION.
                    items:
                      type: string
                      enum: [NATIONAL_ID, BANK_CONFIRMATION, MATRIC_CERTIFICATE, TERTIARY_QUALIFICATION]
        "403":
          description: |
            The caller is neither in the hr_staff group nor the employee (the token email
            must equal the employee's email, compared without case). The body carries no
            employee or document data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Employee not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/employees/{employee_id}/documents/upload-url:
    post:
      tags: [Documents]
      operationId: generateDocumentUploadUrl
      summary: Generate a pre-signed S3 URL for direct browser upload
      description: |
        Two-step upload flow:
        1. Call this endpoint to get a short-lived pre-signed S3 PUT URL.
        2. PUT the file directly from the browser (no Authorization header on S3).
        URL expires in 300 s. Accepted: image/jpeg, image/png, application/pdf.
        KMS-encrypted with alias/naleko-onboarding-pii.
        S3 triggers processDocumentOCR Lambda automatically after upload.
      parameters:
        - name: employee_id
          in: path
          required: true
          schema:
            type: string
            example: EMP-0000014
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentType, contentType]
              properties:
                documentType:
                  type: string
                  enum: [NATIONAL_ID, BANK_CONFIRMATION, QUALIFICATION]
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, application/pdf]
      responses:
        "200":
          description: Pre-signed URL ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                    format: uri
                    description: PUT the file body directly to this URL.
                  key:
                    type: string
                    description: S3 object key for later reference.
        "400":
          description: Unsupported content type or missing fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/employees/{id}/assess-risk:
    post:
      tags: [Verifications]
      operationId: assessOnboardingRisk
      summary: AI risk classification for an employee based on their document verifications
      description: |
        Sends a PII-free summary of all verification results to Claude (Bedrock).

        | Band | Meaning |
        |---|---|
        | LOW | All documents passed with high confidence |
        | MEDIUM | Some documents in manual review or low confidence |
        | HIGH | One or more documents failed or missing |

        Persists riskBand, riskReason, riskAssessedAt to the employee record.
        Requires at least one verification to exist for this employee.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: EMP-0000014
      responses:
        "200":
          description: Risk classified and saved to employee record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  employeeId:
                    type: string
                  risk:
                    type: string
                    enum: [LOW, MEDIUM, HIGH, UNKNOWN]
                  reason:
                    type: string
                    example: All documents passed with high confidence. No anomalies detected.
        "404":
          description: No verifications found for this employee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Bedrock or DynamoDB failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/documents/{id}/url:
    get:
      tags: [Documents]
      operationId: getDocumentPresignedUrl
      summary: Get a short-lived URL to preview or download a document
      description: |
        Returns a pre-signed S3 GET URL expiring in 15 minutes (900 s).
        Open in a browser to render the document inline. Used by the HR portal
        to display uploaded files without exposing S3 credentials.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: doc_1774086521598
      responses:
        "200":
          description: Pre-signed URL generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  file_name:
                    type: string
                  content_type:
                    type: string
                  expires_in:
                    type: integer
                    example: 900
                    description: Seconds until the URL expires.
        "403":
          description: Only HR can open documents (the caller is not in the hr_staff group).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/verifications:
    get:
      tags: [Verifications]
      operationId: listVerifications
      summary: List document verifications across employees
      description: |
        Returns OCR verification records enriched with employee names.
        Only HR staff (the `hr_staff` group) may call it; any other signed-in caller gets 403.
        The Agent API route reuses this Lambda and keeps its unfiltered answer.

        With `waiting=true` it returns the documents still waiting for an HR decision
        (no `hr_reviewed_at`), oldest first, six fields each, plus the full count and a
        count per check. Nothing read from a document (ID number, name, bank detail,
        file address) is in that answer.
      parameters:
        - name: waiting
          in: query
          required: false
          description: When `true`, list documents waiting for an HR decision, oldest first.
          schema:
            type: boolean
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, PASSED, MANUAL_REVIEW, FAILED]
        - name: decision
          in: query
          required: false
          schema:
            type: string
            enum: [PASSED, FAILED, MANUAL_REVIEW]
        - name: employee_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: |
            List of verification records, or, with `waiting=true`, the documents waiting for an HR decision.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/VerificationSummary"
                      count:
                        type: integer
                  - $ref: "#/components/schemas/WaitingDocuments"
        "403":
          description: The caller is not HR staff. Nothing is read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden

  /v1/verifications/{id}:
    get:
      tags: [Verifications]
      operationId: getVerification
      summary: Get one document with its verification, the employee and how it compares with the record (HR only)
      description: |
        HR only (the hr_staff group); anyone else gets 403 before anything is read. `{id}` is the document_id.
        Pass `employee_id` as a query parameter when it is known: the document is then read with one GetItem
        instead of a Scan.

        Returns the document, Batsi's verification (extracted fields, with the ID number decrypted), the
        employee's id and name, Batsi's check, how what was read compares with the employee's record
        (`comparisons`) and HR's decision, when there is one.
        Fields by document type:
        - NATIONAL_ID: id_number, id_number_last4, name, surname, date_of_birth, gender, citizenship
        - BANK_CONFIRMATION: account_holder, bank_name, account_number, branch_code, account_type
        - MATRIC_CERTIFICATE, TERTIARY_QUALIFICATION: no fields beyond the document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: doc_1774086521598
        - name: employee_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The document and its verification.
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    type: object
                    properties:
                      document_id:
                        type: string
                      employee_id:
                        type: string
                      document_type:
                        type: string
                      file_name:
                        type: string
                      s3_key:
                        type: string
                      uploaded_at:
                        type: string
                        format: date-time
                        description: Falls back to the older upload_timestamp.
                      ocr_status:
                        type: string
                      ocr_completed_at:
                        type: string
                  verification:
                    type: object
                    nullable: true
                    properties:
                      verification_id:
                        type: string
                      confidence:
                        type: number
                      decision:
                        type: string
                      reasoning:
                        type: string
                      extracted_data:
                        type: object
                        properties:
                          id_number:
                            type: string
                            nullable: true
                            description: Decrypted for HR.
                          id_number_last4:
                            type: string
                            nullable: true
                          name:
                            type: string
                          surname:
                            type: string
                          date_of_birth:
                            type: string
                          gender:
                            type: string
                          citizenship:
                            type: string
                          account_holder:
                            type: string
                          bank_name:
                            type: string
                          account_number:
                            type: string
                          branch_code:
                            type: string
                          account_type:
                            type: string
                      checks:
                        type: object
                      created_at:
                        type: string
                  can_reupload:
                    type: boolean
                  employee:
                    type: object
                    nullable: true
                    properties:
                      employee_id:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                  check:
                    type: string
                    enum: [READING, MATCHES, NEEDS_A_LOOK, DOESNT_MATCH]
                  hr_decision:
                    type: string
                    nullable: true
                    enum: [ACCEPTED, NEW_ONE_ASKED, null]
                  hr_decided_at:
                    type: string
                    nullable: true
                  hr_decided_by_name:
                    type: string
                    nullable: true
                  hr_decision_reason:
                    type: string
                    nullable: true
                  comparisons:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          enum: [SURNAME, ID_NUMBER, ACCOUNT_HOLDER]
                        result:
                          type: string
                          enum: [AGREES, DIFFERS, NOT_READ, NOT_ON_RECORD]
        "403":
          description: Only HR can open documents (the caller is not in the hr_staff group).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The document could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/verifications/{id}/review:
    patch:
      tags: [Verifications]
      operationId: reviewVerification
      summary: HR officer approves or rejects a document in manual review
      description: |
        HR only. PASSED: approves the document (ocr_status set to PASSED).
        FAILED: rejects it (ocr_status set to FAILED, can_reupload set to true).
        A document is decided once: the decision is one conditional write that records HR's name and the time,
        and a second decision, or a decision while the document is still being read, gets 409.
        `document.reviewed` carries decided_by, decided_by_name, decided_at and actor HUMAN.
        Auto-promotion: when every required document is accepted, the employee stage advances to VERIFIED
        (once per person). The newest read copy of each required type decides; optional documents never
        decide it, either way.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Review recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  document_id:
                    type: string
                  employee_id:
                    type: string
                  decision:
                    type: string
                    enum: [PASSED, FAILED]
                  can_reupload:
                    type: boolean
                  all_documents_passed:
                    type: boolean
                    description: |
                      True when every required document is accepted by HR (the newest read copy of each required
                      type). Optional documents are not looked at.
                  required_documents:
                    type: array
                    description: The required document types used for this decision.
                    items:
                      type: string
                  required_missing:
                    type: array
                    description: Required document types not yet accepted, in the order of required_documents.
                    items:
                      type: string
                  employee_stage_updated:
                    type: boolean
                    description: True if every required document was accepted and the employee was promoted to VERIFIED.
                  hr_decision:
                    type: string
                    enum: [ACCEPTED, NEW_ONE_ASKED]
                  hr_decided_at:
                    type: string
                    format: date-time
                  hr_decided_by_name:
                    type: string
                  hr_decision_reason:
                    type: string
                    nullable: true
        "400":
          description: Invalid decision value, or the reason is longer than 500 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Only HR can decide on a document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Verification not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This document was already decided or is still being read. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/verifications/{id}/summary:
    get:
      tags: [Verifications]
      operationId: getVerificationSummary
      summary: AI-generated plain-English summary of a verification result
      description: |
        Calls Claude (Bedrock) to produce a human-readable digest of the OCR result
        and extracted fields - no raw model output or technical field names.

        Designed for downstream consumers:
        - Employee rejection notifications (why was my document not accepted)
        - WhatsApp / chatbot channels
        - Future mobile app views

        No PII is sent to the model. Response time is typically 2-5 s.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: ver_1774086781234
      responses:
        "200":
          description: AI summary generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verificationId:
                    type: string
                  summary:
                    type: string
                    example: The document is a valid South African ID. All key fields extracted with high confidence.
        "404":
          description: Verification not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Bedrock invocation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/verifications/{id}/external:
    post:
      tags: [Verifications]
      operationId: triggerExternalVerification
      summary: Escalate a verification to an external verification provider
      description: |
        Sets status to EXTERNAL_VERIFICATION_TRIGGERED and publishes a
        VerificationExternalTriggered event to the naleko-onboarding EventBridge bus.
        Requires hr-partners group membership.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: External verification triggered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  verificationId:
                    type: string
                  status:
                    type: string
                    example: EXTERNAL_VERIFICATION_TRIGGERED
        "403":
          description: Caller is not in hr-partners group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Verification is not in an actionable state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

