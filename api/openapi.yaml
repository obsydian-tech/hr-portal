openapi: 3.0.3
info:
  title: Naleko HR Portal API
  version: 1.0.0
  contact:
    name: Naleko Engineering
  description: 'REST API powering the Naleko employee-onboarding HR Portal.


    Two API Gateways deployed in af-south-1 (Cape Town):


    | Gateway | API ID | Handles |

    |---|---|---|

    | Employees | ndksa9ec0k | Employee records, Swagger UI, OpenAPI spec |

    | Documents | b2wt303fc8 | Document upload, OCR verifications, AI risk assessment |


    Authentication: all endpoints require a Cognito ID token unless marked public.

    Authorization: Bearer <id_token>

    Identity and role are derived from JWT claims only (sub + cognito:groups). No custom headers.


    Roles:

    - hr-partners: create employees, review docs, assess risk for their employees

    - hr-managers: same plus full visibility across all employees and verifications


    POPIA: all data stays in af-south-1. No PII leaves South Africa.

    Bedrock AI calls use cross-region inference profiles via AWS infrastructure only.


    Interactive docs: GET https://ndksa9ec0k.execute-api.af-south-1.amazonaws.com/docs

    '
servers:
- url: https://ndksa9ec0k.execute-api.af-south-1.amazonaws.com
  description: Employees API
- url: https://b2wt303fc8.execute-api.af-south-1.amazonaws.com
  description: Documents and Verifications API
tags:
- name: Employees
  description: Create and manage employee records
- name: Documents
  description: Upload documents and generate pre-signed S3 URLs
- name: Verifications
  description: OCR results, HR review workflow, and AI risk assessment
- name: Docs
  description: Swagger UI and raw OpenAPI spec (no auth required)
components:
  securitySchemes:
    CognitoJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito User Pool ID token from InitiateAuth / RespondToAuthChallenge.
    AgentKey:
      type: apiKey
      in: header
      name: x-api-key
      description: The agent API key.
  schemas:
    EmployeeCreate:
      type: object
      required:
      - first_name
      - last_name
      - email
      - phone
      - department
      description: Fields required to register a new employee.
      properties:
        first_name:
          type: string
          example: Jane
        middle_name:
          type: string
        last_name:
          type: string
          example: Smith
        email:
          type: string
          format: email
          example: jane.smith@example.com
        phone:
          type: string
          example: '+27821234567'
        department:
          type: string
          example: Finance
        job_title:
          type: string
          example: Senior Accountant
        offer_accept_date:
          type: string
          format: date
          example: '2026-04-01'
        planned_start_date:
          type: string
          format: date
          example: '2026-05-01'
        id_number:
          type: string
          pattern: ^[0-9]{13}$
          description: Optional South African ID number, 13 digits with a valid date and check digit. Kept encrypted; only the last four digits are stored in clear.
        hr_staff_id:
          type: string
          example: HR-00042
          description: The id of a member of the hr_staff group, as GET /v1/hr-partners lists it. The partner's name and email are taken from the pool, not from the request.
        hr_staff_name:
          type: string
          example: John Doe
          description: Ignored when hr_staff_id is sent.
        hr_staff_email:
          type: string
          format: email
          example: john.doe@example.com
          description: Ignored when hr_staff_id is sent.
    Employee:
      type: object
      description: Full employee record.
      properties:
        employee_id:
          type: string
          example: EMP-0000014
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        department:
          type: string
        job_title:
          type: string
        stage:
          type: string
          enum:
          - INVITED
          - ACTIVE
          - DOCUMENTS_SUBMITTED
          - VERIFIED
          - TRAINING
          - ONBOARDED
          description: 'The stored stage of the old app. Kept next to `step` for the old app until OPS-04 switches it off;

            new screens read `step`.

            '
        step:
          type: string
          nullable: true
          enum:
          - INVITED
          - DOCUMENTS
          - IN_REVIEW
          - VERIFIED
          - null
          description: 'Where the person is in onboarding. INVITED: added by HR, has not signed in yet.

            DOCUMENTS: signed in, and at least one required document is not in yet or was sent back.

            IN_REVIEW: every required document is in and HR has not accepted all of them.

            VERIFIED: HR has accepted every required document.

            Rows written before the step existed answer from their stage; null when the stage is not one of the

            six stored values.

            '
        offer_accept_date:
          type: string
          format: date
        planned_start_date:
          type: string
          format: date
        documents_due:
          type: string
          description: 'The date the required documents are due (YYYY-MM-DD): 7 days before the start date. An empty string when there is no start date.'
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: Cognito sub of the HR staff member who registered this employee.
        hr_staff_id:
          type: string
        hr_staff_name:
          type: string
        hr_staff_email:
          type: string
          format: email
        risk_band:
          type: string
          nullable: true
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - UNKNOWN
          - null
          description: 'HR only, and only in the answer of GET /v1/employees/{id}/verifications (the employee''s own view
            has no such key). The result of the risk check, or null before one has run. LOW: every check matches with high
            confidence. MEDIUM: some checks need a look or have low confidence. HIGH: checks do not match or documents are
            missing. UNKNOWN: the check could not be made (the model failed or answered badly, or AI is off or skipped for
            test data). The check runs once, on its own, when every required document is in.'
        risk_reason:
          type: string
          nullable: true
          description: 'HR only, in the verifications answer. One sentence stored with the result, shown as written. Null
            before a check has run.'
        risk_assessed_at:
          type: string
          format: date-time
          nullable: true
          description: 'HR only, in the verifications answer. When the check ran. Null before a check has run.'
        riskBand:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - UNKNOWN
          nullable: true
          description: AI-assessed onboarding risk. Null until assess-risk is called.
        riskReason:
          type: string
          nullable: true
          description: One-sentence explanation from the AI model for the risk band.
        riskAssessedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent risk assessment.
    Document:
      type: object
      description: A document uploaded by an employee during onboarding.
      properties:
        document_id:
          type: string
          example: doc_1774086521598
        document_type:
          type: string
          enum:
          - NATIONAL_ID
          - BANK_CONFIRMATION
          - QUALIFICATION
        file_name:
          type: string
        uploaded_at:
          type: string
          format: date-time
        ocr_status:
          type: string
          enum:
          - PENDING
          - PASSED
          - MANUAL_REVIEW
          - FAILED
          description: 'PENDING: OCR in progress. PASSED: approved. MANUAL_REVIEW: awaiting HR. FAILED: rejected, employee must re-upload.'
        ocr_completed_at:
          type: string
          format: date-time
          nullable: true
        can_reupload:
          type: boolean
          description: True when status is FAILED and the employee may submit a replacement.
        verification:
          $ref: '#/components/schemas/VerificationSummary'
          nullable: true
    EmployeeDocument:
      description: 'A document as GET /v1/employees/{id}/verifications answers it: the stored document plus

        the check and HR''s decision, worked out by the Lambda so every reader gets one answer.

        '
      allOf:
      - $ref: '#/components/schemas/Document'
      - type: object
        properties:
          document_type:
            type: string
            enum:
            - NATIONAL_ID
            - BANK_CONFIRMATION
            - MATRIC_CERTIFICATE
            - TERTIARY_QUALIFICATION
          check:
            type: string
            enum:
            - READING
            - MATCHES
            - NEEDS_A_LOOK
            - DOESNT_MATCH
            description: 'READING: the file is still being read. MATCHES: a verification at 90% confidence or more.

              NEEDS_A_LOOK: under 90%, or the file could not be read. DOESNT_MATCH: reserved for ONB-07.

              '
          hr_decision:
            type: string
            nullable: true
            enum:
            - ACCEPTED
            - NEW_ONE_ASKED
            - null
            description: Null until HR decides. Told apart by hr_reviewed_at, because HR's decision overwrites ocr_status.
          hr_decided_at:
            type: string
            format: date-time
            nullable: true
            description: When HR decided, or null.
    WaitingDocuments:
      type: object
      description: Documents waiting for an HR decision (ONB-13), oldest first.
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              document_id:
                type: string
              employee_id:
                type: string
              employee_name:
                type: string
              document_type:
                type: string
              check:
                type: string
                enum:
                - READING
                - MATCHES
                - NEEDS_A_LOOK
                - DOESNT_MATCH
              arrived_at:
                type: string
                format: date-time
                nullable: true
        count:
          type: integer
          description: Every waiting document, not one page.
        counts:
          type: object
          properties:
            READING:
              type: integer
            MATCHES:
              type: integer
            NEEDS_A_LOOK:
              type: integer
            DOESNT_MATCH:
              type: integer
    VerificationSummary:
      type: object
      description: Condensed OCR result used in list views and embedded in Document records.
      properties:
        verification_id:
          type: string
          example: ver_1774086781234
        id_number_last4:
          type: string
          nullable: true
          description: The last four digits of the ID number. The full number is never in this answer (ONB-14).
        account_number_last4:
          type: string
          nullable: true
        id_number_available:
          type: boolean
          description: True when the document holds an ID number that Show can return.
        account_number_available:
          type: boolean
          description: True when the document holds an account number that Show can return.
        employee_id:
          type: string
          example: EMP-0000014
        employee_name:
          type: string
          example: Jane Smith
        document_type:
          type: string
          enum:
          - NATIONAL_ID
          - BANK_CONFIRMATION
          - QUALIFICATION
        document_id:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 100
          example: 95
          description: OCR confidence score as a percentage (0-100).
        decision:
          type: string
          enum:
          - PASSED
          - FAILED
          - MANUAL_REVIEW
          description: 'PASSED: accepted. FAILED: rejected. MANUAL_REVIEW: below confidence threshold, awaiting HR.'
        created_at:
          type: string
          format: date-time
    VerificationDetail:
      allOf:
      - $ref: '#/components/schemas/VerificationSummary'
      description: Full verification record including OCR reasoning and extracted fields.
      properties:
        reasoning:
          type: string
          description: OCR model explanation for why the document passed, failed, or needs review.
        name:
          type: string
        surname:
          type: string
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
        citizenship:
          type: string
        account_holder:
          type: string
        bank_name:
          type: string
        branch_code:
          type: string
        account_type:
          type: string
        institution:
          type: string
        qualification_name:
          type: string
        graduation_year:
          type: string
    ReviewRequest:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - PASSED
          - FAILED
          description: PASSED approves the document. FAILED rejects it and allows re-upload.
        notes:
          type: string
          maxLength: 500
          example: The photo is too dark to read.
          description: The reason for FAILED, at most 500 characters. The page asks for one.
        employee_id:
          type: string
          description: The document's employee. When given, the document is read with one GetItem instead of a Scan.
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        missing:
          type: array
          items:
            type: string
          description: Required fields that were absent (400 responses only).
    Department:
      type: object
      description: REC-14. One department of the company's list. The id never changes; an archived one is kept, never deleted.
      additionalProperties: false
      required:
      - id
      - name
      - status
      properties:
        id:
          type: string
          pattern: ^dep_[0-9A-HJKMNP-TV-Z]{26}$
        name:
          type: string
          minLength: 1
          maxLength: 80
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
    DepartmentList:
      type: object
      description: REC-14. The company's list and its version (0 and no departments while the company has no list).
      additionalProperties: false
      required:
      - version
      - departments
      properties:
        version:
          type: integer
          minimum: 0
        departments:
          type: array
          items:
            $ref: '#/components/schemas/Department'
    DepartmentChange:
      type: object
      description: REC-14. The answer to an add or a change.
      additionalProperties: false
      required:
      - version
      - department
      properties:
        version:
          type: integer
          minimum: 1
        department:
          $ref: '#/components/schemas/Department'
    DepartmentError:
      type: object
      description: REC-14. A refusal of the department routes.
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - Bad request
          - Forbidden
          - Not found
          - Conflict
          - Something went wrong
        code:
          type: string
          enum:
          - INVALID_FIELD
          - IDEMPOTENCY_KEY_REQUIRED
          - DUPLICATE_NAME
          - TOO_MANY_DEPARTMENTS
          - STALE_VERSION
        field:
          type: string
          enum:
          - name
          - status
          - expected_version
    RoleError:
      type: object
      description: REC-14. A refusal of the role routes.
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: string
        code:
          type: string
        field:
          type: string
        open_candidates:
          type: integer
    Role:
      type: object
      description: REC-14. A role with its counts. department_id is absent on an old role whose department is free text (until step D); department is then that text.
      additionalProperties: false
      required:
      - role_id
      - job_title
      - department
      - level
      - hiring_manager_id
      - criteria
      - panel_size
      - status
      - opened_at
      - opened_by
      - legacy
      - candidate_count
      - overdue_count
      - due_soon_count
      properties:
        role_id:
          type: string
        job_title:
          type: string
        department_id:
          type: string
        department:
          type: string
        level:
          type: string
        hiring_manager_id:
          type: string
        criteria:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - key
            - label
            properties:
              key:
                type: string
              label:
                type: string
        panel_size:
          type: integer
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
        opened_at:
          type: string
        opened_by:
          type: string
        closed_at:
          type: string
        closed_by:
          type: string
        legacy:
          type: boolean
        candidate_count:
          type: integer
        overdue_count:
          type: integer
        due_soon_count:
          type: integer
    RoleOptions:
      type: object
      description: REC-14. Everything the Open a role page offers, from one answer. No email, group or company in it.
      additionalProperties: false
      required:
      - departments
      - levels
      - criteria
      - panel_size_by_level
      - screening
      - hiring_managers
      properties:
        departments:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - name
            properties:
              id:
                type: string
                pattern: ^dep_[0-9A-HJKMNP-TV-Z]{26}$
              name:
                type: string
        levels:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - key
            - label
            - order
            properties:
              key:
                type: string
              label:
                type: string
              order:
                type: integer
        criteria:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - key
            - label
            properties:
              key:
                type: string
              label:
                type: string
        panel_size_by_level:
          type: object
          additionalProperties:
            type: integer
        screening:
          type: boolean
        hiring_managers:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - name
            properties:
              id:
                type: string
              name:
                type: string
security:
- CognitoJWT: []
paths:
  /v1/invites/lookup:
    post:
      tags:
      - Invites
      operationId: lookupInvite
      summary: Look up an invite link (public, ONB-04)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: The state of the link. invalid carries no other field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - expired
                    - used
                    - invalid
                  company:
                    type: string
                  firstName:
                    type: string
                  email:
                    type: string
                  startDate:
                    type: string
                  hrPartnerName:
                    type: string
        '400':
          description: The body is missing or not JSON.
      servers:
      - url: https://ndksa9ec0k.execute-api.af-south-1.amazonaws.com
      x-tenant: stored-record
      x-roles: []
  /v1/employees/{id}/invite:
    get:
      tags:
      - Invites
      operationId: getInvite
      summary: The invite link of one Invited person (HR only, ONB-18)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The latest link. sentAt, expiresAt and sentTo are left out when status is none.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - expired
                    - used
                    - none
                  sentAt:
                    type: string
                    format: date-time
                  expiresAt:
                    type: string
                    format: date-time
                  sentTo:
                    type: string
        '403':
          description: Only HR can see the invite link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Forbidden
        '404':
          description: No such employee.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Not found
      servers:
      - url: https://ndksa9ec0k.execute-api.af-south-1.amazonaws.com
      security:
      - CognitoJWT: []
      x-tenant: token
      x-roles:
      - hr_staff
    post:
      tags:
      - Invites
      operationId: resendInvite
      summary: Close the link and send a new one (HR only, ONB-18)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A new link is made and the old one is closed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  sentAt:
                    type: string
                    format: date-time
                  expiresAt:
                    type: string
                    format: date-time
                  sentTo:
                    type: string
                  email:
                    type: object
                    properties:
                      sent:
                        type: boolean
                      skipped:
                        type: string
        '403':
          description: Only HR can send a new link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Forbidden
        '404':
          description: No such employee.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Not found
        '409':
          description: The person is not Invited, or the sign-in is already in use or disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - not-invited
                    - refused
        '502':
          description: The link could not be made.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - failed
      servers:
      - url: https://ndksa9ec0k.execute-api.af-south-1.amazonaws.com
      security:
      - CognitoJWT: []
      x-tenant: token
      x-roles:
      - hr_staff
  /v1/invites/redeem:
    post:
      tags:
      - Invites
      operationId: redeemInvite
      summary: Set the password with an invite link (public, ONB-04)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - password
              properties:
                token:
                  type: string
                password:
                  type: string
      responses:
        '204':
          description: The password is set; the link is used.
        '400':
          description: The body is missing, or the password breaks a rule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  fields:
                    type: object
                    properties:
                      password:
                        type: array
                        items:
                          type: string
                          enum:
                          - minLength
                          - maxLength
                          - lower
                          - upper
                          - number
                          - symbol
        '410':
          description: The link is expired, used or invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - expired
                    - used
                    - invalid
        '502':
          description: Cognito could not set the password; the link still works.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      servers:
      - url: https://ndksa9ec0k.execute-api.af-south-1.amazonaws.com
      x-tenant: stored-record
      x-roles: []
  /v1/employees/lookup:
    get:
      tags:
      - Employees
      operationId: lookupEmployeeEmail
      summary: Resolve an Employee ID to an email address
      description: 'Public - no auth required.

        Used by the login screen so an employee can find their email before sign-in.

        '
      security: []
      parameters:
      - name: employeeId
        in: query
        required: true
        schema:
          type: string
          example: EMP-0000014
      responses:
        '200':
          description: Email resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    format: email
        '400':
          description: Missing or malformed employee ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No employee found with that ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      servers:
      - url: https://ndksa9ec0k.execute-api.af-south-1.amazonaws.com
      x-tenant: stored-record
      x-roles: []
  /v1/employees:
    get:
      tags:
      - Employees
      operationId: listEmployees
      summary: List employees visible to the calling HR staff member
      description: 'Returns employees managed by the caller (scoped to their Cognito sub).

        Members of hr-managers see all employees regardless.

        '
      parameters:
      - name: stage
        in: query
        required: false
        schema:
          type: string
          enum:
          - INVITED
