      description: 'HR only (the hr_staff group); anyone else gets 403 before anything is read. `{id}` is the document_id.

        Pass `employee_id` as a query parameter when it is known: the document is then read with one GetItem

        instead of a Scan.


        Returns the document, Batsi''s verification (extracted fields, with the ID number decrypted), the

        employee''s id and name, Batsi''s check, how what was read compares with the employee''s record

        (`comparisons`) and HR''s decision, when there is one.

        Fields by document type:

        - NATIONAL_ID: id_number_last4, id_number_available, name, surname, date_of_birth, gender, citizenship

        - BANK_CONFIRMATION: account_holder, bank_name, account_number_last4, account_number_available, branch_code, account_type

        The full ID number and account number are not in this answer (ONB-14). They come only from
        `POST /v1/verifications/{id}/reveal`, which records who showed them.

        - MATRIC_CERTIFICATE, TERTIARY_QUALIFICATION: no fields beyond the document

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: doc_1774086521598
      - name: employee_id
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The document and its verification.
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    type: object
                    properties:
                      document_id:
                        type: string
                      employee_id:
                        type: string
                      document_type:
                        type: string
                      file_name:
                        type: string
                      s3_key:
                        type: string
                      uploaded_at:
                        type: string
                        format: date-time
                        description: Falls back to the older upload_timestamp.
                      ocr_status:
                        type: string
                      ocr_completed_at:
                        type: string
                  verification:
                    type: object
                    nullable: true
                    properties:
                      verification_id:
                        type: string
                      confidence:
                        type: number
                      decision:
                        type: string
                      reasoning:
                        type: string
                      extracted_data:
                        type: object
                        properties:
                          id_number_last4:
                            type: string
                            nullable: true
                          id_number_available:
                            type: boolean
                            description: True when the document holds an ID number that Show can return.
                          account_number_last4:
                            type: string
                            nullable: true
                          account_number_available:
                            type: boolean
                            description: True when the document holds an account number that Show can return.
                          name:
                            type: string
                          surname:
                            type: string
                          date_of_birth:
                            type: string
                          gender:
                            type: string
                          citizenship:
                            type: string
                          account_holder:
                            type: string
                          bank_name:
                            type: string
                          branch_code:
                            type: string
                          account_type:
                            type: string
                      checks:
                        type: object
                      created_at:
                        type: string
                  can_reupload:
                    type: boolean
                  employee:
                    type: object
                    nullable: true
                    properties:
                      employee_id:
                        type: string
