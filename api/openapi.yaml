  /v1/candidates/{id}/stage:
    put:
      summary: "PUT /v1/candidates/{id}/stage: a person moves a candidate one step, with a reason (REC-03)"
      description: Moves a candidate one step along Applied, Screening (when the company has it on), Interview and Offer, forward or back. A reason is required. Hired and Not hired are never reached here. Interview to Offer is the gate. The hiring manager may make that one move only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - to
              - reason
              properties:
                to:
                  type: string
                  enum:
                  - APPLIED
                  - SCREENING
                  - INTERVIEW
                  - OFFER
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: OK
          content:
            application/json:
