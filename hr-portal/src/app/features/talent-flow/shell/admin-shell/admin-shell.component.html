<!-- Admin Workspace Shell — darker topbar + 220px left sidebar -->

<!-- ── Admin Topbar ──────────────────────────────────────────────────────── -->
<header class="tf-admin-topbar">
  <div class="tf-admin-topbar__left">
    <div class="tf-admin-brand">
      <span class="tf-admin-brand__mark">TF</span>
      <span class="tf-admin-brand__name">TalentFlow</span>
      <span class="tf-admin-brand__badge">Admin</span>
    </div>
  </div>

  <div class="tf-admin-topbar__right">
    <p-button
      label="← Back to TalentFlow"
      styleClass="tf-admin-btn-back"
      [text]="true"
      (onClick)="backToTalentFlow()"
    />
    <span class="tf-admin-user-name">{{ displayName() }}</span>
    <p-avatar
      [label]="initials()"
      shape="circle"
      styleClass="tf-admin-avatar"
    />
  </div>
</header>

<!-- ── Body: sidebar + content ──────────────────────────────────────────── -->
<div class="tf-admin-body">

  <!-- Left Sidebar -->
  <nav class="tf-admin-sidebar" aria-label="Admin navigation">
    <div class="tf-admin-sidebar__section">
      <span class="tf-admin-sidebar__section-label">Workspace</span>

      <!-- Section 1: Overview — active -->
      <a class="tf-admin-sidebar__item"
         routerLink="/platform/talentflow/admin/overview"
         routerLinkActive="tf-admin-sidebar__item--active">
        <i class="pi pi-chart-bar"></i>
        <span>Overview</span>
      </a>

      <!-- Section 2: Users & Roles — active -->
      <a class="tf-admin-sidebar__item"
         routerLink="/platform/talentflow/admin/users"
         routerLinkActive="tf-admin-sidebar__item--active">
        <i class="pi pi-users"></i>
        <span>Users &amp; Roles</span>
      </a>

      <!-- Section 3: Tenant Settings — coming soon -->
      <span class="tf-admin-sidebar__item tf-admin-sidebar__item--soon">
        <i class="pi pi-cog"></i>
        <span>Tenant Settings</span>
        <span class="tf-admin-sidebar__soon-badge">Soon</span>
      </span>

      <!-- Section 4: TalentFlow Config — coming soon -->
      <span class="tf-admin-sidebar__item tf-admin-sidebar__item--soon">
        <i class="pi pi-sliders-h"></i>
        <span>TalentFlow Config</span>
        <span class="tf-admin-sidebar__soon-badge">Soon</span>
      </span>

      <!-- Section 5: IT Request Config — coming soon -->
      <span class="tf-admin-sidebar__item tf-admin-sidebar__item--soon">
        <i class="pi pi-server"></i>
        <span>IT Request Config</span>
        <span class="tf-admin-sidebar__soon-badge">Soon</span>
      </span>

      <!-- Section 6: Audit & Compliance — coming soon -->
      <span class="tf-admin-sidebar__item tf-admin-sidebar__item--soon">
        <i class="pi pi-shield"></i>
        <span>Audit &amp; Compliance</span>
        <span class="tf-admin-sidebar__soon-badge">Soon</span>
      </span>

      <!-- Section 7: Notifications — coming soon -->
      <span class="tf-admin-sidebar__item tf-admin-sidebar__item--soon">
        <i class="pi pi-bell"></i>
        <span>Notifications</span>
        <span class="tf-admin-sidebar__soon-badge">Soon</span>
      </span>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="tf-admin-main">
    <router-outlet />
  </main>

</div>
