<p-dialog
  header="Add User"
  [visible]="visible()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '32rem' }"
  styleClass="tfad-drawer"
  (onHide)="onHide()"
>

  @if (error()) {
    <div class="tfad-drawer-error">
      <i class="pi pi-exclamation-circle"></i>
      {{ error() }}
    </div>
  }

  <div class="tfad-form">

    <div class="tfad-field">
      <label class="tfad-field__label" for="addEmail">Work email *</label>
      <input
        id="addEmail"
        class="tfad-input"
        type="email"
        placeholder="user@company.com"
        [(ngModel)]="email"
      />
    </div>

    <div class="tfad-field-row">
      <div class="tfad-field">
        <label class="tfad-field__label" for="addGiven">First name *</label>
        <input
          id="addGiven"
          class="tfad-input"
          type="text"
          placeholder="Jane"
          [(ngModel)]="givenName"
        />
      </div>
      <div class="tfad-field">
        <label class="tfad-field__label" for="addFamily">Last name *</label>
        <input
          id="addFamily"
          class="tfad-input"
          type="text"
          placeholder="Smith"
          [(ngModel)]="familyName"
        />
      </div>
    </div>

    <div class="tfad-field">
      <label class="tfad-field__label">
        Roles * <span class="tfad-field__hint">(select at least one)</span>
      </label>
      <div class="tfad-role-list">
        @for (role of allRoles; track role) {
          <label class="tfad-role-item">
            <p-checkbox
              [binary]="true"
              [ngModel]="roles.includes(role)"
              (onChange)="toggleRole(role, $event.checked)"
            />
            <span>{{ roleLabels[role] }}</span>
          </label>
        }
      </div>
    </div>

  </div>

  <ng-template pTemplate="footer">
    <div class="tfad-drawer-footer">
      <p-button label="Cancel" styleClass="p-button-text" (onClick)="onHide()" />
      <p-button
        label="Create User"
        icon="pi pi-check"
        [loading]="saving()"
        (onClick)="submit()"
      />
    </div>
  </ng-template>

</p-dialog>
