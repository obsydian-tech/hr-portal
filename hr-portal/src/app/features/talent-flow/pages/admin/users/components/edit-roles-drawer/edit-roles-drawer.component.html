<p-dialog
  [header]="user() ? 'Edit Roles — ' + user()!.fullName : 'Edit Roles'"
  [visible]="visible()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '28rem' }"
  styleClass="tfad-drawer"
  (onHide)="onHide()"
>

  @if (error()) {
    <div class="tfad-drawer-error">
      <i class="pi pi-exclamation-circle"></i>
      {{ error() }}
    </div>
  }

  <div class="tfad-form">
    <div class="tfad-field">
      <label class="tfad-field__label">
        Roles <span class="tfad-field__hint">(at least one required)</span>
      </label>
      <div class="tfad-role-list">
        @for (role of allRoles; track role) {
          <label class="tfad-role-item">
            <p-checkbox
              [binary]="true"
              [ngModel]="roles.includes(role)"
              (onChange)="toggleRole(role, $event.checked)"
            />
            <span>{{ roleLabels[role] }}</span>
          </label>
        }
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="tfad-drawer-footer">
      <p-button label="Cancel" styleClass="p-button-text" (onClick)="onHide()" />
      <p-button
        label="Save Roles"
        icon="pi pi-check"
        [loading]="saving()"
        (onClick)="submit()"
      />
    </div>
  </ng-template>

</p-dialog>
