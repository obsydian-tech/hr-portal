<p-drawer
  [visible]="visible()"
  (visibleChange)="$event || close()"
  position="right"
  styleClass="tf-queue-drawer"
  [style]="{ width: '480px' }"
  [blockScroll]="true"
>
  <ng-template pTemplate="header">
    <h3 class="drawer-title">{{ isEditMode() ? 'Edit Queue' : 'New Queue' }}</h3>
  </ng-template>

  <div class="drawer-body">

    <!-- Name -->
    <div class="form-field">
      <label class="form-label" for="q-name">Queue Name <span class="required">*</span></label>
      <input
        pInputText id="q-name" type="text"
        [ngModel]="form().name"
        (ngModelChange)="patchForm({ name: $event })"
        placeholder="e.g. Hardware Setup"
        class="form-input"
      />
    </div>

    <!-- Description -->
    <div class="form-field">
      <label class="form-label" for="q-desc">Description</label>
      <textarea
        pTextarea id="q-desc" rows="3"
        [ngModel]="form().description"
        (ngModelChange)="patchForm({ description: $event })"
        placeholder="What does this queue handle?"
        class="form-input"
        [autoResize]="true"
      ></textarea>
    </div>

    <!-- Category -->
    <div class="form-field">
      <label class="form-label" for="q-cat">Category <span class="required">*</span></label>
      <p-select
        inputId="q-cat"
        [ngModel]="form().category"
        (ngModelChange)="patchForm({ category: $event })"
        [options]="categoryOpts"
        optionLabel="label"
        optionValue="value"
        styleClass="form-dropdown"
        appendTo="body"
      />
    </div>

    <!-- SLA Hours -->
    <div class="form-field">
      <label class="form-label" for="q-sla">SLA Window (hours) <span class="required">*</span></label>
      <p-inputNumber
        inputId="q-sla"
        [ngModel]="form().slaHours"
        (ngModelChange)="patchForm({ slaHours: $event })"
        [min]="1" [max]="720" [showButtons]="true"
        buttonLayout="horizontal"
        incrementButtonIcon="pi pi-plus"
        decrementButtonIcon="pi pi-minus"
        suffix=" hrs"
        styleClass="form-input-number"
      />
    </div>

    <!-- Assigned Specialists -->
    <div class="form-field">
      <label class="form-label" for="q-spec">Assigned Specialists</label>
      <p-multiSelect
        inputId="q-spec"
        [ngModel]="form().assignedSpecialists"
        (ngModelChange)="patchForm({ assignedSpecialists: $event })"
        [options]="availableSpecialists()"
        optionLabel="label"
        optionValue="id"
        [filter]="true"
        filterBy="label,email"
        placeholder="Select IT specialists…"
        [loading]="specialistsLoading()"
        styleClass="form-multiselect"
        display="chip"
        appendTo="body"
      />
      <span class="form-hint">All active users are listed. Assign users who will handle this queue.</span>
    </div>

  </div>

  <ng-template pTemplate="footer">
    <div class="drawer-footer">
      <p-button label="Cancel" styleClass="p-button-text p-button-secondary" (onClick)="close()" />
      <p-button
        [label]="isEditMode() ? 'Save Changes' : 'Create Queue'"
        icon="pi pi-check"
        [disabled]="!valid"
        (onClick)="submit()"
      />
    </div>
  </ng-template>
</p-drawer>
