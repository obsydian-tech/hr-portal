<main class="platform-home">
  <div class="platform-home__header">
    <h1 class="platform-home__greeting">{{ greeting() }}</h1>
    <p class="platform-home__subtitle">Your HR workspace</p>
  </div>

  <section class="platform-home__modules">
    <h2 class="platform-home__section-title">Your Modules</h2>
    <div class="platform-home__tile-grid">
      @for (tile of tiles(); track tile.key) {
        <div
          class="module-tile"
          [class.module-tile--active]="tile.available"
          [class.module-tile--locked]="!tile.available"
          (click)="openModule(tile)"
          [attr.role]="tile.available ? 'button' : null"
          [attr.tabindex]="tile.available ? 0 : null"
          (keydown.enter)="openModule(tile)"
        >
          <div class="module-tile__icon-wrap">
            <i [class]="tile.icon + ' module-tile__icon'"></i>
          </div>

          <div class="module-tile__body">
            <div class="module-tile__label-row">
              <span class="module-tile__label">{{ tile.label }}</span>
              @if (!tile.available) {
                <p-tag
                  [value]="tile.comingSoon ? 'Coming Soon' : 'Upgrade'"
                  severity="secondary"
                  class="module-tile__badge"
                />
              }
            </div>
            <p class="module-tile__description">{{ tile.description }}</p>
          </div>

          @if (tile.available) {
            <div class="module-tile__cta">
              <p-button
                label="Open"
                icon="pi pi-arrow-right"
                iconPos="right"
                [text]="true"
                size="small"
              />
            </div>
          }
        </div>
      }
    </div>
  </section>
</main>
