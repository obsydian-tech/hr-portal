# ---------------------------------------------------------------------------
# Lambda code deploy: build once, deploy the same zips everywhere.
#
#   merge to main  ->  build (one deterministic zip per lambda/ folder)
#                  ->  deploy to pepla-dev (GitHub env "dev", OIDC role)
#                  ->  wait for Iggie's Approve (GitHub env "production")
#                  ->  deploy the SAME zips to prod (code-only role)
#
# Terraform owns configuration and ignores Lambda code; this owns code only.
# Logs show function names and counts only: the repo is public.
# ---------------------------------------------------------------------------
name: Deploy Lambdas

on:
  push:
    branches: [main]
    paths:
      - "lambda/**"
      - "scripts/ci/build-lambdas.py"
      - "scripts/ci/deploy-lambdas.sh"
      - ".github/workflows/deploy-lambdas.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lambdas
  cancel-in-progress: false

env:
  AWS_REGION: af-south-1

jobs:
  build:
    name: Build Lambda bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build
        run: python3 scripts/ci/build-lambdas.py

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-bundles-${{ github.sha }}
          path: dist/lambdas/
          retention-days: 14
          if-no-files-found: error

  deploy-dev:
    name: Deploy to pepla-dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lambda-bundles-${{ github.sha }}
          path: dist/lambdas/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::424556617428:role/pepla-github-deploy-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Check we are in pepla-dev
        run: |
          acct=$(aws sts get-caller-identity --query Account --output text)
          [ "$acct" = "424556617428" ] || { echo "::error::not pepla-dev"; exit 1; }

      - name: Deploy code
        run: scripts/ci/deploy-lambdas.sh dist/lambdas

  deploy-prod:
    name: Promote to prod (needs Approve)
    needs: [build, deploy-dev]
    # Off until the first prod promotion has been checked by hand: set the
    # repository variable PROD_LAMBDA_DEPLOY to "true" to switch it on.
    if: vars.PROD_LAMBDA_DEPLOY == 'true'
    runs-on: ubuntu-latest
    # Required reviewer (Iggie) and main-only are set on this environment.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lambda-bundles-${{ github.sha }}
          path: dist/lambdas/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::937137806477:role/pepla-github-deploy-code-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Check we are in prod
        run: |
          acct=$(aws sts get-caller-identity --query Account --output text)
          [ "$acct" = "937137806477" ] || { echo "::error::not prod"; exit 1; }

      - name: Deploy the same code that passed dev
        run: scripts/ci/deploy-lambdas.sh dist/lambdas
