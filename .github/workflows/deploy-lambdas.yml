# ---------------------------------------------------------------------------
# Lambda code deploy. Two long-lived branches:
#
#   merge to develop ->  build (one deterministic zip per lambda/ folder)
#                  ->  deploy to pepla-dev (GitHub env "dev", OIDC role)
#                  ->  call app-e2e-dev.yml: seed pepla-dev, then run every
#                      journey of the current app and the new app's pepla-dev
#                      tests (once per merge, after the deploy)
#
#   merge to main    ->  build the same code (it reached main from develop)
#     (release)    ->  wait for Iggie's Approve (GitHub env "production")
#                  ->  deploy to prod (code-only role)
#
# Web app changes are tested on every PR by app-e2e-dev.yml; after a merge it
# steps aside when this workflow starts for the same commit.
# Docs (*.md, docs/, help pictures and videos) start nothing.
# Terraform owns configuration and ignores Lambda code; this owns code only.
# Logs show function names and counts only: the repo is public.
# ---------------------------------------------------------------------------
name: Deploy Lambdas

on:
  push:
    branches: [develop, main]
    paths:
      - "lambda/**"
      - "scripts/ci/build-lambdas.py"
      - "scripts/ci/check-ai-guard.py"
      - "scripts/ci/deploy-lambdas.sh"
      - ".github/workflows/deploy-lambdas.yml"
      - "scripts/ci/seed-dev.py"
      - "scripts/ci/cleanup-dev-e2e.py"
      - "scripts/ci/load-e2e-logins.py"
      - "scripts/ci/dev-frontend-env.sh"
      - "hr-portal/e2e/**"
      # Docs start nothing.
      - "!**/*.md"
      - "!docs/**"
      - "!pepla-web/help/media/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lambdas-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: af-south-1

jobs:
  build:
    name: Build Lambda bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: AI cost guardrail check
        run: python3 scripts/ci/check-ai-guard.py

      - name: Build
        run: python3 scripts/ci/build-lambdas.py

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-bundles-${{ github.sha }}
          path: dist/lambdas/
          retention-days: 14
          if-no-files-found: error

  deploy-dev:
    name: Deploy to pepla-dev
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lambda-bundles-${{ github.sha }}
          path: dist/lambdas/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::424556617428:role/pepla-github-deploy-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Check we are in pepla-dev
        run: |
          acct=$(aws sts get-caller-identity --query Account --output text)
          [ "$acct" = "424556617428" ] || { echo "::error::not pepla-dev"; exit 1; }

      - name: Deploy code
        run: scripts/ci/deploy-lambdas.sh dist/lambdas

  # Tests the new Lambda code on pepla-dev, and the new app with it, once the
  # deploy has succeeded. app-e2e-dev.yml holds the steps, the lock on
  # pepla-dev's seeded data and the comment on the merged PR.
  e2e-dev:
    name: E2E on pepla-dev
    needs: deploy-dev
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/app-e2e-dev.yml
    with:
      full: true

  deploy-prod:
    name: Promote to prod (needs Approve)
    needs: build
    # Only from main (the release merge from develop, where this code was
    # deployed and tested). Switched by the repository variable
    # PROD_LAMBDA_DEPLOY ("true" = on).
    if: github.ref == 'refs/heads/main' && vars.PROD_LAMBDA_DEPLOY == 'true'
    runs-on: ubuntu-latest
    # Required reviewer (Iggie) and main-only are set on this environment.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lambda-bundles-${{ github.sha }}
          path: dist/lambdas/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::937137806477:role/pepla-github-deploy-code-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Check we are in prod
        run: |
          acct=$(aws sts get-caller-identity --query Account --output text)
          [ "$acct" = "937137806477" ] || { echo "::error::not prod"; exit 1; }

      - name: Deploy the same code that passed pepla-dev
        run: scripts/ci/deploy-lambdas.sh dist/lambdas
