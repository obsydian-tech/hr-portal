# ---------------------------------------------------------------------------
# Lambda code deploy: build once, deploy the same zips everywhere.
#
#   merge to main  ->  build (one deterministic zip per lambda/ folder)
#                  ->  deploy to pepla-dev (GitHub env "dev", OIDC role)
#                  ->  seed pepla-dev, run the Playwright journeys against it
#                  ->  wait for Iggie's Approve (GitHub env "production")
#                  ->  deploy the SAME zips to prod (code-only role)
#
# Terraform owns configuration and ignores Lambda code; this owns code only.
# Logs show function names and counts only: the repo is public.
# ---------------------------------------------------------------------------
name: Deploy Lambdas

on:
  push:
    branches: [main]
    paths:
      - "lambda/**"
      - "scripts/ci/build-lambdas.py"
      - "scripts/ci/deploy-lambdas.sh"
      - ".github/workflows/deploy-lambdas.yml"
      - "scripts/ci/seed-dev.py"
      - "scripts/ci/cleanup-dev-e2e.py"
      - "scripts/ci/load-e2e-logins.py"
      - "scripts/ci/dev-frontend-env.sh"
      - "hr-portal/e2e/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lambdas
  cancel-in-progress: false

env:
  AWS_REGION: af-south-1

jobs:
  build:
    name: Build Lambda bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build
        run: python3 scripts/ci/build-lambdas.py

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-bundles-${{ github.sha }}
          path: dist/lambdas/
          retention-days: 14
          if-no-files-found: error

  deploy-dev:
    name: Deploy to pepla-dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lambda-bundles-${{ github.sha }}
          path: dist/lambdas/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::424556617428:role/pepla-github-deploy-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Check we are in pepla-dev
        run: |
          acct=$(aws sts get-caller-identity --query Account --output text)
          [ "$acct" = "424556617428" ] || { echo "::error::not pepla-dev"; exit 1; }

      - name: Deploy code
        run: scripts/ci/deploy-lambdas.sh dist/lambdas

  e2e-dev:
    name: E2E on pepla-dev
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hr-portal/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::424556617428:role/pepla-github-deploy-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Seed demo company and test logins
        run: |
          pip install --quiet boto3
          python3 scripts/ci/seed-dev.py

      - name: Point the app at pepla-dev
        run: scripts/ci/dev-frontend-env.sh

      - name: Load test logins (masked)
        run: python3 scripts/ci/load-e2e-logins.py

      - name: Install app and browser
        working-directory: hr-portal
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the app
        working-directory: hr-portal
        run: |
          npx ng serve --host 127.0.0.1 --port 4200 > /tmp/ng-serve.log 2>&1 &
          npx wait-on http://127.0.0.1:4200 --timeout 180000

      - name: Run journeys
        working-directory: hr-portal
        env:
          E2E_BASE_URL: http://localhost:4200
        run: npx playwright test --config e2e/playwright.config.ts

      - name: Clean up this run's records
        if: always()
        run: python3 scripts/ci/cleanup-dev-e2e.py

      # Failure pictures and videos show seeded fake people only. Short-lived.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-dev-report-${{ github.run_id }}
          path: |
            hr-portal/e2e/e2e/reports/
            hr-portal/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy-prod:
    name: Promote to prod (needs Approve)
    needs: [build, deploy-dev, e2e-dev]
    # Off until the first prod promotion has been checked by hand: set the
    # repository variable PROD_LAMBDA_DEPLOY to "true" to switch it on.
    if: vars.PROD_LAMBDA_DEPLOY == 'true'
    runs-on: ubuntu-latest
    # Required reviewer (Iggie) and main-only are set on this environment.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lambda-bundles-${{ github.sha }}
          path: dist/lambdas/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::937137806477:role/pepla-github-deploy-code-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Check we are in prod
        run: |
          acct=$(aws sts get-caller-identity --query Account --output text)
          [ "$acct" = "937137806477" ] || { echo "::error::not prod"; exit 1; }

      - name: Deploy the same code that passed dev
        run: scripts/ci/deploy-lambdas.sh dist/lambdas
