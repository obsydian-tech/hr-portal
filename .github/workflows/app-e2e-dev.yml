# App tests on dev: run the onboarding journeys against pepla-dev
# It runs after the merge, never on a pull request:
#   - when web app code merges into develop,
#   - every Monday (full run), by hand, and after a Lambda deploy.
# A red run shows on the merged PR's comment and on the next merge.
# Release PRs develop -> main don't re-run it: that code already passed here.
#
# Test selection (keeps runs short as the app grows): a PR or merge runs only
# the journeys tagged for the modules it changed, plus the @smoke set;
# shared code runs everything. See scripts/ci/pick-e2e-tests.py. Every
# Monday 05:00 SAST a full run checks all journeys.
# The new app (pepla-web) runs its acceptance tests here too, against the real
# pepla-dev sign-in pool, with the same seeded test logins (tests tagged
# @pepla-dev; the no-backend run is in pepla-web.yml).
# Backend code and prod are never touched, and nothing here asks for an
# Approve. Backend changes are deployed by deploy-lambdas.yml, which calls this
# workflow after the deploy (so a merge that changes Lambda code is tested once,
# against the new code, and the new app is included). On a merge that
# deploy-lambdas.yml will also start, the "gate" job below steps aside.
# Docs (*.md, docs/, help pictures and videos) start no run at all.
# Runs wait for pepla-dev in the order they arrive (queue: max, nothing is
# dropped for being late); only a PR's own newer push cancels its older run.
#
# AI cost guardrail: test logins are robots (group e2e-robots), the specs
# block AI routes in the browser (fixtures/no-ai), and the dev CI role is
# denied Bedrock/Textract. So a run costs nothing in AI.
name: App tests on dev

on:
  push:
    branches: [develop]
    paths:
      - "hr-portal/src/**"
      - "hr-portal/angular.json"
      - "hr-portal/package.json"
      - "hr-portal/package-lock.json"
      - "hr-portal/tsconfig*.json"
      - "pepla-web/**"
      - "scripts/ci/dev-frontend-env.sh"
      - "scripts/ci/check-dev-signin.py"
      - ".github/workflows/app-e2e-dev.yml"
      - "!**/*.md"
      - "!docs/**"
      - "!pepla-web/help/media/**"
  schedule:
    - cron: "0 3 * * 1" # Monday 05:00 SAST: full run
  workflow_dispatch:
  # Called by deploy-lambdas.yml once the new Lambda code is on pepla-dev.
  workflow_call:
    inputs:
      full:
        description: "Run every journey of the current app (not only the ones picked from the changed files)"
        type: boolean
        default: false
      on_web_address:
        description: "Run the new app's pepla-dev tests against its pepla-dev web address (OPS-01), not against ng serve. Only after Deploy Lambdas has copied the build there."
        type: boolean
        default: false

# Only a PR's newer push cancels that PR's own older run. Every other run
# (merge, Monday, by hand, after-deploy call) gets a group of its own, so it is
# never replaced. The pepla-dev lock itself is on the e2e-dev job below.
concurrency:
  group: app-e2e-dev-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: af-south-1

jobs:
  # Decides whether this run happens. A merge that deploy-lambdas.yml also
  # starts is tested there, once, after the deploy, so this run steps aside.
  gate:
    name: Should this run start
    runs-on: ubuntu-latest
    # actions: write only so a run that tests nothing can end as cancelled, not green.
    permissions:
      contents: read
      actions: write
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && !inputs.full
        with:
          fetch-depth: 0
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          run=true
          if [ "$EVENT" = "push" ] && [ "$FULL" != "true" ]; then
            covered=$(python3 scripts/ci/deploy-covers-commit.py "$BEFORE" "$AFTER")
            [ "$covered" = "true" ] && run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      # A run that tested nothing must not end with a green tick. Only the stand-alone push
      # run can step aside (the call from Deploy Lambdas is "full"), so this never cancels a
      # run that tests something. The tests job below is skipped because run=false.
      - name: Step aside, shown as cancelled
        if: steps.decide.outputs.run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Deploy Lambdas tests this commit after deploying, so this run steps aside."
          gh run cancel "$GITHUB_RUN_ID" || echo "::warning::Could not mark this run as cancelled."

  e2e-dev:
    name: App E2E on pepla-dev
    needs: gate
    # PRs from forks get no AWS access; only branches in this repo run here.
    if: needs.gate.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Shares pepla-dev's seeded data with deploy-lambdas.yml: never run both at once.
    concurrency:
      group: pepla-dev-e2e
      cancel-in-progress: false
      queue: max
    # Pinned: the repo's Playwright version has no Chromium build for the
    # newer ubuntu-latest image. Move with the next Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write
      pull-requests: write # the result comment
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to see which files the change touched

      # Weekly and by-hand runs do everything; a new branch's first push too.
      - name: Pick journeys for this change
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          FULL: ${{ inputs.full }}
        run: |
          case "$EVENT" in
            pull_request) range="$BASE...HEAD" ;;
            push) [[ "$BEFORE" =~ ^0+$ ]] && range="" || range="$BEFORE..HEAD" ;;
            *) range="" ;;
          esac
          # Called after a Lambda deploy: every journey of the current app.
          [ "$FULL" = "true" ] && range=""
          if [ -n "$range" ]; then
            git diff --name-only "$range" | python3 scripts/ci/pick-e2e-tests.py >> "$GITHUB_OUTPUT"
          else
            printf 'grep=\nmodules=all journeys (full run)\n' >> "$GITHUB_OUTPUT"
          fi
          grep -E '^(grep|modules)=' "$GITHUB_OUTPUT" | tail -2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            hr-portal/package-lock.json
            pepla-web/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::424556617428:role/pepla-github-deploy-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Check we are in pepla-dev
        run: |
          acct=$(aws sts get-caller-identity --query Account --output text)
          [ "$acct" = "424556617428" ] || { echo "::error::not pepla-dev"; exit 1; }

      # REC-12: seed-dev.py writes the Recruitment Standard pack with scripts/tenancy/seed-recruitment-pack.mjs, which needs the
      # script's own packages and the ones lambda/shared/recruitment-settings.mjs needs.
      - name: Install the packages the Standard pack needs
        run: |
          npm ci --prefix scripts
          npm ci --prefix lambda/shared

      - name: Seed demo company and test logins
        run: |
          pip install --quiet boto3
          python3 scripts/ci/seed-dev.py
          python3 scripts/ci/seed-dev-files.py

      # REC-12: company A's Recruitment settings are the Standard pack, written by the same seed MOD-01's switch-on runs, never by
      # Terraform. It creates only what is missing, so a second run changes nothing. Company B gets none here: REC-12 AC-9 itself
      # switches B's Recruitment on through set-modules (which writes the pack), reads it, and switches B back off.
      - name: Give the first company the Recruitment Standard pack
        run: |
          tenant=$(sed -n 's/^[[:space:]]*founding_tenant_id[[:space:]]*=[[:space:]]*"\(ten_[0-9a-z]\{26\}\)".*/\1/p' infra/env/dev.tfvars | head -1)
          [ -n "$tenant" ] || { echo "::error::infra/env/dev.tfvars has no founding_tenant_id"; exit 1; }
          node scripts/tenancy/seed-recruitment-pack.mjs --tenant "$tenant" --apply

      # REC-03: the seed writes three candidates in the old stage form; the stage move turns them (and any other old row of company A)
      # into the six stages. It checks the account first, writes a history row for each move, and changes nothing on a second run.
      - name: Move the first company's candidates to the six stages
        run: |
          tenant=$(sed -n 's/^[[:space:]]*founding_tenant_id[[:space:]]*=[[:space:]]*"\(ten_[0-9a-z]\{26\}\)".*/\1/p' infra/env/dev.tfvars | head -1)
          [ -n "$tenant" ] || { echo "::error::infra/env/dev.tfvars has no founding_tenant_id"; exit 1; }
          node scripts/recruitment/migrate-stages.mjs --env dev --tenant "$tenant" --apply

      - name: Point the app at pepla-dev
        run: scripts/ci/dev-frontend-env.sh

      - name: Load test logins (masked)
        run: python3 scripts/ci/load-e2e-logins.py

      # TEN-04: the company walk calls the agent API with its key. The address comes from the API's name, the key from
      # the secret the agent API already uses on pepla-dev (masked, never printed). Without access the walk reports
      # that the key is missing; nothing else here fails.
      - name: Load the agent API address and key (masked)
        run: |
          addr=$(aws apigatewayv2 get-apis --region af-south-1 --query "Items[?Name=='naleko-agent-api'].ApiEndpoint | [0]" --output text)
          echo "E2E_AGENT_API_URL=$addr" >> "$GITHUB_ENV"
          if key=$(aws secretsmanager get-secret-value --region af-south-1 --secret-id naleko/agent/api-key --query SecretString --output text 2>/dev/null); then
            echo "::add-mask::$key"
            echo "E2E_AGENT_KEY=$key" >> "$GITHUB_ENV"
          else
            echo "::warning::could not read naleko/agent/api-key; the TEN-04 company walk will stop at the missing key"
          fi

      - name: Install app and browser
        working-directory: hr-portal
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the app
        working-directory: hr-portal
        run: |
          npx ng serve --host 127.0.0.1 --port 4200 > /tmp/ng-serve.log 2>&1 &
          npx wait-on http://127.0.0.1:4200 --timeout 180000

      - name: Run journeys
        id: journeys
        working-directory: hr-portal
        env:
          E2E_BASE_URL: http://localhost:4200
          GREP: ${{ steps.pick.outputs.grep }}
        run: npx playwright test --config e2e/playwright.config.ts ${GREP:+--grep "$GREP"}

      # The new app: its acceptance tests that need a real sign-in, at desktop and phone.
      # Runs even when the old journeys failed, so one report shows both.
      # The new app is Angular 22, which needs Node 22; the current app above stays on 20.
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: "22"

      - name: Install new app and browser
        if: ${{ !cancelled() }}
        working-directory: pepla-web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # After a merge the new app is already deployed: its tests use that address.
      # Pull requests have no address of their own and keep ng serve on 127.0.0.1:4300.
      - name: Find the new app's pepla-dev address
        if: ${{ !cancelled() && inputs.on_web_address }}
        run: |
          addr=$(scripts/ci/dev-web-address.sh)
          echo "::add-mask::${addr##*/}"
          echo "WEB_ADDRESS=$addr" >> "$GITHUB_ENV"

      - name: Start the new app
        if: ${{ !cancelled() && !inputs.on_web_address }}
        working-directory: pepla-web
        run: |
          npx ng serve --host 127.0.0.1 --port 4300 > /tmp/ng-serve-pepla-web.log 2>&1 &
          npx wait-on http://127.0.0.1:4300 --timeout 180000

      # ONB-22 AC-7 proposes Accept document for a seeded document. A proposal an earlier run left open answers 409.
      - name: Clear proposals an earlier run left on the ONB-22 test documents
        run: python3 scripts/ci/cleanup-dev-e2e.py --agent-actions

      # MOD-01 AC-10 and REC-12 AC-9 run scripts/tenancy/set-modules.mjs as a child process (each switches company B's Recruitment on, then back off in a finally block). It needs the script's own packages and
      # the ones lambda/shared/modules.mjs (which it imports) needs.
      - name: Install the packages set-modules needs
        if: ${{ !cancelled() }}
        run: |
          npm ci --prefix scripts
          npm ci --prefix lambda/shared

      # REC-01 AC-9 expects the manager login to be hiring manager for exactly one candidate. A candidate a test added on a role it opened
      # stays on dev after the run, so clear it (and put the seeded hiring board back) before the main run starts.
      - name: Clear leftover candidates before the main run
        if: ${{ !cancelled() }}
        run: |
          pip install --quiet boto3
          python3 scripts/ci/reset-dev-rec04.py

      - name: Run new app acceptance tests
        id: acceptance
        if: ${{ !cancelled() }}
        working-directory: pepla-web
        env:
          ACCEPTANCE_TARGET: pepla-dev
          E2E_BASE_URL: ${{ inputs.on_web_address && env.WEB_ADDRESS || 'http://127.0.0.1:4300' }}
          CI: "true"
          # Company B's HR login (hr-b, loaded above as E2E_HR_B_*) under the names MOD-02, REC-UI-01 AC-13 and REC-UI-02 AC-15 read.
          # Without these they skip on every run. Same secret values, nothing printed.
          E2E_B_HR_EMAIL: ${{ env.E2E_HR_B_EMAIL }}
          E2E_B_HR_PASSWORD: ${{ env.E2E_HR_B_PASSWORD }}
        # The company walk (TEN-04 AC-7) runs in its own step below: its "company B" caller is the walk company's HR login.
        # ONB-10 AC-8 runs in its own step after that: ONB-07 and ONB-08 upload and accept the test login's required
        # documents earlier in this run, and AC-8 needs one still to give.
        run: npm run e2e:acceptance -- --grep-invert "company B walk on pepla-dev|AC-13 @pepla-dev The Recruiter sees Roles|ONB-10 Due dates and Overdue.*AC-8 pepla-dev|REC-02 .* AC-12 The test logins on pepla-dev|REC-03 .* AC-11 The test logins on pepla-dev|REC-04 .* AC-10 The test logins on pepla-dev|REC-05 .* AC-11 The test logins on pepla-dev|REC-15 step C .* AC-17 on pepla-dev|REC-15 step D .* AC-17 on pepla-dev|INT-01 .* AC-18 on pepla-dev: company B|MOD-01 .* AC-10 Today.s users unaffected|REC-12 .* AC-9 The test logins on pepla-dev"

      # REC-01 AC-9 expects the manager login to be hiring manager for exactly one candidate. Read only: list which rows the manager has,
      # so a second one can be named (ids and dates only). Writes nothing.
      - name: Show the manager login's candidates (read only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          pip install --quiet boto3
          python3 scripts/ci/show-manager-candidates.py

      # REC-05 AC-11 got 409 OFFER_EXISTS on the seeded candidate. Read only: print its lock, old-shape and offer rows (keys, state,
      # version, dates; no names, emails or salary), right after the main run. Writes nothing.
      - name: Show the REC-05 seeded candidate's offer rows (after the main run, read only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          pip install --quiet boto3
          python3 scripts/ci/show-offer-rows.py

      # MOD-01 AC-10 and REC-12 AC-9 switch company B's Recruitment on with set-modules.mjs and back off. The Lambdas cache a company's
      # modules for up to 60 seconds, so a test that signs in as company B in the next minute still sees both modules (MOD-02 AC-9 and
      # MOD-03 AC-8 failed that way once the main run gave them B's login). Run them straight after the main run: MOD-01 AC-10 expects company A to have exactly Onboarding and Recruitment, so it must come before the step that switches Ask Batsi on, and the company walk after it takes longer than the cache.
      - name: Switch Recruitment on for company B and back (MOD-01 AC-10, REC-12 AC-9)
        id: module-switch
        if: ${{ !cancelled() }}
        working-directory: pepla-web
        env:
          ACCEPTANCE_TARGET: pepla-dev
          E2E_BASE_URL: ${{ inputs.on_web_address && env.WEB_ADDRESS || 'http://127.0.0.1:4300' }}
          CI: "true"
        # list reporter only, as the company walk: the JSON report of the main run is the one the PR comment reads
        run: npx playwright test -c e2e/acceptance/playwright.config.ts --reporter=list --project=desktop-1280 --grep "MOD-01 .* AC-10 Today.s users unaffected|REC-12 .* AC-9 The test logins on pepla-dev"

      # Ask Batsi is off for every company until an admin turns it on (CHAT-02), and the seed puts the dev companies back
      # to their modules on each run. The walk needs it on for company A and for the walk company (its "company B"):
      # with it off every chat route answers 403 to both, and the walk could prove nothing about them.
      - name: Switch Ask Batsi on for the walk companies
        if: ${{ !cancelled() }}
        run: |
          pip install --quiet boto3
          python3 scripts/ci/dev-ask-batsi-on.py

      # REC-04 AC-10 pins how many candidates are open on Fleet controller. REC-12 AC-9 and REC-UI-02 AC-17 add one each on every run
      # and leave it open, so the count grew by one or more on every dev run. Put the hiring board back to its seeded rows first.
      - name: Put the hiring board's seeded candidates back (before the company walk)
        if: ${{ !cancelled() }}
        run: |
          pip install --quiet boto3
          python3 scripts/ci/reset-dev-rec04.py

      # TEN-04 AC-7: the company walk. Its "company B" callers are the logins of the third (walk) company, which has
      # Recruitment switched on (company B has only Onboarding, so on B every Recruitment route answers 403 and the
      # walk cannot look for 404). The test reads its HR caller as E2E_HR_B; here that name points at hr-c.
      # REC-02 AC-12, REC-03 AC-11, REC-04 AC-10 and REC-05 AC-11 also look for 404 as company B, so they run here too and not in the main run above.
      - name: Company walk (TEN-04)
        id: walk
        if: ${{ !cancelled() }}
        working-directory: pepla-web
        env:
          ACCEPTANCE_TARGET: pepla-dev
          E2E_BASE_URL: ${{ inputs.on_web_address && env.WEB_ADDRESS || 'http://127.0.0.1:4300' }}
          CI: "true"
        run: |
          export E2E_HR_B_EMAIL="$E2E_HR_C_EMAIL" E2E_HR_B_PASSWORD="$E2E_HR_C_PASSWORD"
          # list reporter only: the JSON report of the main run above is the one the PR comment reads
          npx playwright test -c e2e/acceptance/playwright.config.ts --reporter=list --grep "company B walk on pepla-dev|REC-02 .* AC-12 The test logins on pepla-dev|REC-03 .* AC-11 The test logins on pepla-dev|REC-04 .* AC-10 The test logins on pepla-dev|REC-05 .* AC-11 The test logins on pepla-dev|REC-15 step C .* AC-17 on pepla-dev|REC-15 step D .* AC-17 on pepla-dev|INT-01 .* AC-18 on pepla-dev: company B"

      # REC-05 AC-11 got 409 OFFER_EXISTS on the seeded candidate. Read only: print its lock, old-shape and offer rows (keys, state,
      # version, dates; no names, emails or salary), right after the company walk. Writes nothing.
      - name: Show the REC-05 seeded candidate's offer rows (after the company walk, read only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          pip install --quiet boto3
          python3 scripts/ci/show-offer-rows.py

      # REC-UI-01 AC-13: the Recruiter test records the seeded candidate Tendai Ncube as Not hired, and the seed only runs once per
      # run. In the main run the phone project came second and found no Tendai in Interview. So the test runs here, once per project,
      # with the hiring board's seeded rows put back (scripts/ci/reset-dev-rec04.py) before each.
      - name: Put the hiring board's seeded candidates back (before desktop)
        if: ${{ !cancelled() }}
        run: |
          pip install --quiet boto3
          python3 scripts/ci/reset-dev-rec04.py

      - name: Hire board on pepla-dev at desktop (REC-UI-01 AC-13)
        id: hire-board-desktop
        if: ${{ !cancelled() }}
        working-directory: pepla-web
        env:
          ACCEPTANCE_TARGET: pepla-dev
          E2E_BASE_URL: ${{ inputs.on_web_address && env.WEB_ADDRESS || 'http://127.0.0.1:4300' }}
          CI: "true"
        # list reporter only, as the company walk: the JSON report of the main run is the one the PR comment reads
        run: npx playwright test -c e2e/acceptance/playwright.config.ts --reporter=list --project=desktop-1280 --grep "AC-13 @pepla-dev The Recruiter sees Roles"

      - name: Put the hiring board's seeded candidates back (before phone)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/reset-dev-rec04.py

      - name: Hire board on pepla-dev at phone (REC-UI-01 AC-13)
        id: hire-board-phone
        if: ${{ !cancelled() }}
        working-directory: pepla-web
        env:
          ACCEPTANCE_TARGET: pepla-dev
          E2E_BASE_URL: ${{ inputs.on_web_address && env.WEB_ADDRESS || 'http://127.0.0.1:4300' }}
          CI: "true"
        run: npx playwright test -c e2e/acceptance/playwright.config.ts --reporter=list --project=phone-390 --grep "AC-13 @pepla-dev The Recruiter sees Roles"

      # ONB-10 AC-8: the employee test login's checklist with a required document still to give. The login is put
      # back to the seed's clean start first (stage INVITED, no documents, notice not accepted), then the one test runs.
      - name: Put the employee test login back to its clean start
        if: ${{ !cancelled() }}
        run: |
          pip install --quiet boto3
          python3 scripts/ci/reset-dev-persona.py

      - name: Due dates on the test login's checklist (ONB-10)
        id: due-dates
        if: ${{ !cancelled() }}
        working-directory: pepla-web
        env:
          ACCEPTANCE_TARGET: pepla-dev
          E2E_BASE_URL: ${{ inputs.on_web_address && env.WEB_ADDRESS || 'http://127.0.0.1:4300' }}
          CI: "true"
        # list reporter only, as the company walk: the JSON report of the main run is the one the PR comment reads
        run: npx playwright test -c e2e/acceptance/playwright.config.ts --reporter=list --grep "ONB-10 Due dates and Overdue.*AC-8 pepla-dev"

      # BE-15 AC-6: a new employee gets a sign-in in the dev pool (the real
      # POST /v1/employees, then the pool is read). Cleanup below removes it.
      - name: New employee gets a dev sign-in
        if: ${{ !cancelled() }}
        run: |
          pip install --quiet boto3
          python3 scripts/ci/check-dev-signin.py

      - name: Show the new app's server log
        if: failure()
        run: tail -n 60 /tmp/ng-serve-pepla-web.log || true

      - name: Clean up this run's records
        if: always()
        run: python3 scripts/ci/cleanup-dev-e2e.py

      # Failure pictures and videos show seeded fake people only. Short-lived.
      - name: Upload report
        id: report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e-dev-report-${{ github.run_id }}
          path: |
            hr-portal/e2e/e2e/reports/
            hr-portal/e2e/test-results/
            pepla-web/e2e/acceptance/.output/
          retention-days: 7
          if-no-files-found: ignore
          # .output/ starts with a dot: without this the action skips it, and the screenshots and traces never arrive.
          include-hidden-files: true

      # One comment per PR, updated on each run: which journeys passed, how
      # long they took, and where the failure evidence is. On a push to
      # develop, a new comment goes on the PR that was merged.
      - name: Post results on the PR
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: actions/github-script@v7
        env:
          JOURNEYS_OUTCOME: ${{ steps.journeys.outcome }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          MODULES: ${{ steps.pick.outputs.modules }}
          FULL: ${{ inputs.full }}
        with:
          script: |
            const fs = require('fs');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const files = [
              ['hr-portal/e2e/results/results.json', process.env.JOURNEYS_OUTCOME, ''],
              ['pepla-web/e2e/acceptance/.output/results.json', process.env.ACCEPTANCE_OUTCOME, 'New app › '],
            ].filter(([f, o]) => fs.existsSync(f) && o && o !== 'skipped');
            const rows = [];
            const cards = [];
            const sizeOf = (project) => (project === 'phone-390' ? 'Phone' : 'Desktop');
            const walk = (suite, parents, isNew) => {
              const names = suite.title && !/\.(ts|js)$/.test(suite.title) ? [...parents, suite.title] : parents;
              for (const spec of suite.specs ?? []) {
                for (const t of spec.tests ?? []) {
                  const last = (t.results ?? []).at(-1) ?? {};
                  const tries = (t.results ?? []).length;
                  const icon = t.status === 'expected' ? (tries > 1 ? '🟡 passed on retry' : '✅ passed')
                    : t.status === 'skipped' ? '⚪ skipped' : '❌ failed';
                  rows.push({
                    group: names.join(' › '),
                    title: spec.title.replace(/\s*@pepla-dev\b/g, '').trim(),
                    size: isNew ? sizeOf(t.projectName) : 'Desktop',
                    icon, secs: ((last.duration ?? 0) / 1000).toFixed(1), failed: t.status === 'unexpected',
                  });
                  // The card id is the first word of the top-level describe, e.g. ONB-01.
                  const card = names[0]?.split(' ')[0];
                  if (isNew && card && !cards.includes(card)) cards.push(card);
                }
              }
              for (const child of suite.suites ?? []) walk(child, names, isNew);
            };
            let body;
            if (files.length) {
              let ms = 0;
              for (const [file, , prefix] of files) {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                const before = rows.length;
                for (const s of data.suites ?? []) walk(s, [], prefix !== '');
                for (const r of rows.slice(before)) r.group = prefix + r.group;
                ms += data.stats?.duration ?? 0;
              }
              const failed = rows.filter(r => r.failed).length;
              const took = ms < 60000 ? `${Math.round(ms / 1000)} s` : `${(ms / 60000).toFixed(1)} min`;
              const head = failed ? `❌ **${failed} of ${rows.length} tests failed** on pepla-dev (${took})`
                : `✅ **All ${rows.length} tests passed** on pepla-dev (${took})`;
              const table = ['| Journey | Test | Size | Result | Time |', '| --- | --- | --- | --- | --- |',
                ...rows.map(r => `| ${r.group} | ${r.title} | ${r.size} | ${r.icon} | ${r.secs}s |`)].join('\n');
              const evidence = failed && process.env.REPORT_URL
                ? `\n\nScreenshots, videos and traces of the failures (kept 7 days): ${process.env.REPORT_URL}` : '';
              const modules = process.env.MODULES || 'all journeys';
              const currentLine = process.env.FULL === 'true'
                ? '- Current app: all journeys, because this commit deployed Lambda code to pepla-dev.'
                : `- Current app: ${modules}, picked from the files this change touched.`;
              const newLine = cards.length
                ? `- New app: every test that needs pepla-dev (${cards.join(', ')}), at desktop and phone.`
                : '- New app: did not run.';
              const ran = `\n\nRan:\n${currentLine}\n${newLine}\nFull run every Monday.`;
              body = `${head}${ran}\n\n${table}${evidence}\n\nTest logins are robots and AI calls are blocked, so this run cost nothing in AI. [Run log](${run})`;
            } else {
              body = `⚠️ **The tests did not run**: a setup step failed before the tests started. [Run log](${run})`;
            }
            const when = context.eventName === 'pull_request' ? 'before merge' : 'after merge into develop';
            const marker = `<!-- app-e2e-dev:${context.eventName} -->`;
            body = `${marker}\n### App tests on pepla-dev, ${when}\n\n${body}`;
            let pr = context.payload.pull_request?.number;
            if (!pr) {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: context.sha });
              pr = prs.find(p => p.merged_at)?.number;
            }
            if (!pr) { core.info('No PR for this commit; nothing to comment on.'); return; }
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr, per_page: 100 });
            const mine = comments.find(c => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
