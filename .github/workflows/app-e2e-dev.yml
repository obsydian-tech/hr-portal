# App tests on dev: run the onboarding journeys against pepla-dev
#   - on every PR into develop that changes the web app or its tests
#     (tests the PR's own app code; red = don't merge), and
#   - after web app code merges into develop.
# Release PRs develop -> main don't re-run it: that code already passed here.
# Backend code and prod are never touched, and nothing here asks for an
# Approve. Backend changes are deployed and tested by deploy-lambdas.yml.
#
# AI cost guardrail: test logins are robots (group e2e-robots), the specs
# block AI routes in the browser (fixtures/no-ai), and the dev CI role is
# denied Bedrock/Textract. So a run costs nothing in AI.
name: App tests on dev

on:
  pull_request:
    branches: [develop]
    paths:
      - "hr-portal/src/**"
      - "hr-portal/e2e/**"
      - "hr-portal/angular.json"
      - "hr-portal/package.json"
      - "hr-portal/package-lock.json"
      - "hr-portal/tsconfig*.json"
      - ".github/workflows/app-e2e-dev.yml"
  push:
    branches: [develop]
    paths:
      - "hr-portal/src/**"
      - "hr-portal/angular.json"
      - "hr-portal/package.json"
      - "hr-portal/package-lock.json"
      - "hr-portal/tsconfig*.json"
      - ".github/workflows/app-e2e-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: af-south-1

jobs:
  e2e-dev:
    name: App E2E on pepla-dev
    # PRs from forks get no AWS access; only branches in this repo run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Shares pepla-dev's seeded data with deploy-lambdas.yml: never run both at once.
    concurrency:
      group: pepla-dev-e2e
      cancel-in-progress: false
    # Pinned: the repo's Playwright version has no Chromium build for the
    # newer ubuntu-latest image. Move with the next Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write
      pull-requests: write # the result comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hr-portal/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::424556617428:role/pepla-github-deploy-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Check we are in pepla-dev
        run: |
          acct=$(aws sts get-caller-identity --query Account --output text)
          [ "$acct" = "424556617428" ] || { echo "::error::not pepla-dev"; exit 1; }

      - name: Seed demo company and test logins
        run: |
          pip install --quiet boto3
          python3 scripts/ci/seed-dev.py

      - name: Point the app at pepla-dev
        run: scripts/ci/dev-frontend-env.sh

      - name: Load test logins (masked)
        run: python3 scripts/ci/load-e2e-logins.py

      - name: Install app and browser
        working-directory: hr-portal
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the app
        working-directory: hr-portal
        run: |
          npx ng serve --host 127.0.0.1 --port 4200 > /tmp/ng-serve.log 2>&1 &
          npx wait-on http://127.0.0.1:4200 --timeout 180000

      - name: Run journeys
        id: journeys
        working-directory: hr-portal
        env:
          E2E_BASE_URL: http://localhost:4200
        run: npx playwright test --config e2e/playwright.config.ts

      - name: Clean up this run's records
        if: always()
        run: python3 scripts/ci/cleanup-dev-e2e.py

      # Failure pictures and videos show seeded fake people only. Short-lived.
      - name: Upload report
        id: report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e-dev-report-${{ github.run_id }}
          path: |
            hr-portal/e2e/e2e/reports/
            hr-portal/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # One comment per PR, updated on each run: which journeys passed, how
      # long they took, and where the failure evidence is. On a push to
      # develop, a new comment goes on the PR that was merged.
      - name: Post results on the PR
        if: always() && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          JOURNEYS_OUTCOME: ${{ steps.journeys.outcome }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const file = 'hr-portal/e2e/results/results.json';
            const rows = [];
            const walk = (suite, parents) => {
              const names = suite.title && !/\.(ts|js)$/.test(suite.title) ? [...parents, suite.title] : parents;
              for (const spec of suite.specs ?? []) {
                for (const t of spec.tests ?? []) {
                  const last = (t.results ?? []).at(-1) ?? {};
                  const tries = (t.results ?? []).length;
                  const icon = t.status === 'expected' ? (tries > 1 ? '🟡 passed on retry' : '✅ passed')
                    : t.status === 'skipped' ? '⚪ skipped' : '❌ failed';
                  rows.push({ group: names.join(' › '), title: spec.title, icon, secs: ((last.duration ?? 0) / 1000).toFixed(1), failed: t.status === 'unexpected' });
                }
              }
              for (const child of suite.suites ?? []) walk(child, names);
            };
            let body;
            const outcome = process.env.JOURNEYS_OUTCOME;
            if (fs.existsSync(file) && outcome && outcome !== 'skipped') {
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              for (const s of data.suites ?? []) walk(s, []);
              const failed = rows.filter(r => r.failed).length;
              const ms = data.stats?.duration ?? 0;
              const took = ms < 60000 ? `${Math.round(ms / 1000)} s` : `${(ms / 60000).toFixed(1)} min`;
              const head = failed ? `❌ **${failed} of ${rows.length} tests failed** on pepla-dev (${took})`
                : `✅ **All ${rows.length} tests passed** on pepla-dev (${took})`;
              const table = ['| Journey | Test | Result | Time |', '| --- | --- | --- | --- |',
                ...rows.map(r => `| ${r.group} | ${r.title} | ${r.icon} | ${r.secs}s |`)].join('\n');
              const evidence = failed && process.env.REPORT_URL
                ? `\n\nScreenshots, videos and traces of the failures (kept 7 days): ${process.env.REPORT_URL}` : '';
              body = `${head}\n\n${table}${evidence}\n\nTest logins are robots and AI calls are blocked, so this run cost nothing in AI. [Run log](${run})`;
            } else {
              body = `⚠️ **The tests did not run**: a setup step failed before the tests started. [Run log](${run})`;
            }
            const when = context.eventName === 'pull_request' ? 'before merge' : 'after merge into develop';
            const marker = `<!-- app-e2e-dev:${context.eventName} -->`;
            body = `${marker}\n### App tests on pepla-dev, ${when}\n\n${body}`;
            let pr = context.payload.pull_request?.number;
            if (!pr) {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: context.sha });
              pr = prs.find(p => p.merged_at)?.number;
            }
            if (!pr) { core.info('No PR for this commit; nothing to comment on.'); return; }
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr, per_page: 100 });
            const mine = comments.find(c => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
