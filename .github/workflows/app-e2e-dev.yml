# App tests on dev: run the onboarding journeys against pepla-dev
#   - on every PR into develop that changes the web app or its tests
#     (tests the PR's own app code; red = don't merge), and
#   - after web app code merges into develop.
# Release PRs develop -> main don't re-run it: that code already passed here.
#
# Test selection (keeps runs short as the app grows): a PR or merge runs only
# the journeys tagged for the modules it changed, plus the @smoke set;
# shared code runs everything. See scripts/ci/pick-e2e-tests.py. Every
# Monday 05:00 SAST a full run checks all journeys.
# The new app (pepla-web) runs its acceptance tests here too, against the real
# pepla-dev sign-in pool, with the same seeded test logins (tests tagged
# @pepla-dev; the no-backend run is in pepla-web.yml).
# Backend code and prod are never touched, and nothing here asks for an
# Approve. Backend changes are deployed by deploy-lambdas.yml, which calls this
# workflow after the deploy (so a merge that changes Lambda code is tested once,
# against the new code, and the new app is included). On a merge that
# deploy-lambdas.yml will also start, the "gate" job below steps aside.
# Docs (*.md, docs/, help pictures and videos) start no run at all.
# Runs wait for pepla-dev in the order they arrive (queue: max, nothing is
# dropped for being late); only a PR's own newer push cancels its older run.
#
# AI cost guardrail: test logins are robots (group e2e-robots), the specs
# block AI routes in the browser (fixtures/no-ai), and the dev CI role is
# denied Bedrock/Textract. So a run costs nothing in AI.
name: App tests on dev

on:
  pull_request:
    branches: [develop]
    paths:
      - "hr-portal/src/**"
      - "hr-portal/e2e/**"
      - "scripts/ci/pick-e2e-tests.py"
      - "hr-portal/angular.json"
      - "hr-portal/package.json"
      - "hr-portal/package-lock.json"
      - "hr-portal/tsconfig*.json"
      - "pepla-web/**"
      - "scripts/ci/dev-frontend-env.sh"
      - ".github/workflows/app-e2e-dev.yml"
      - "!**/*.md"
      - "!docs/**"
      - "!pepla-web/help/media/**"
  push:
    branches: [develop]
    paths:
      - "hr-portal/src/**"
      - "hr-portal/angular.json"
      - "hr-portal/package.json"
      - "hr-portal/package-lock.json"
      - "hr-portal/tsconfig*.json"
      - "pepla-web/**"
      - "scripts/ci/dev-frontend-env.sh"
      - ".github/workflows/app-e2e-dev.yml"
      - "!**/*.md"
      - "!docs/**"
      - "!pepla-web/help/media/**"
  schedule:
    - cron: "0 3 * * 1" # Monday 05:00 SAST: full run
  workflow_dispatch:
  # Called by deploy-lambdas.yml once the new Lambda code is on pepla-dev.
  workflow_call:
    inputs:
      full:
        description: "Run every journey of the current app (not only the ones picked from the changed files)"
        type: boolean
        default: false

# Only a PR's newer push cancels that PR's own older run. Every other run
# (merge, Monday, by hand, after-deploy call) gets a group of its own, so it is
# never replaced. The pepla-dev lock itself is on the e2e-dev job below.
concurrency:
  group: app-e2e-dev-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: af-south-1

jobs:
  # Decides whether this run happens. A merge that deploy-lambdas.yml also
  # starts is tested there, once, after the deploy, so this run steps aside.
  gate:
    name: Should this run start
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && !inputs.full
        with:
          fetch-depth: 0
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          run=true
          if [ "$EVENT" = "push" ] && [ "$FULL" != "true" ]; then
            covered=$(python3 scripts/ci/deploy-covers-commit.py "$BEFORE" "$AFTER")
            [ "$covered" = "true" ] && run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ "$run" = "true" ] || echo "Deploy Lambdas tests this commit after deploying, so this run steps aside."

  e2e-dev:
    name: App E2E on pepla-dev
    needs: gate
    # PRs from forks get no AWS access; only branches in this repo run here.
    if: needs.gate.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Shares pepla-dev's seeded data with deploy-lambdas.yml: never run both at once.
    concurrency:
      group: pepla-dev-e2e
      cancel-in-progress: false
      queue: max
    # Pinned: the repo's Playwright version has no Chromium build for the
    # newer ubuntu-latest image. Move with the next Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write
      pull-requests: write # the result comment
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to see which files the change touched

      # Weekly and by-hand runs do everything; a new branch's first push too.
      - name: Pick journeys for this change
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          FULL: ${{ inputs.full }}
        run: |
          case "$EVENT" in
            pull_request) range="$BASE...HEAD" ;;
            push) [[ "$BEFORE" =~ ^0+$ ]] && range="" || range="$BEFORE..HEAD" ;;
            *) range="" ;;
          esac
          # Called after a Lambda deploy: every journey of the current app.
          [ "$FULL" = "true" ] && range=""
          if [ -n "$range" ]; then
            git diff --name-only "$range" | python3 scripts/ci/pick-e2e-tests.py >> "$GITHUB_OUTPUT"
          else
            printf 'grep=\nmodules=all journeys (full run)\n' >> "$GITHUB_OUTPUT"
          fi
          grep -E '^(grep|modules)=' "$GITHUB_OUTPUT" | tail -2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            hr-portal/package-lock.json
            pepla-web/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::424556617428:role/pepla-github-deploy-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Check we are in pepla-dev
        run: |
          acct=$(aws sts get-caller-identity --query Account --output text)
          [ "$acct" = "424556617428" ] || { echo "::error::not pepla-dev"; exit 1; }

      - name: Seed demo company and test logins
        run: |
          pip install --quiet boto3
          python3 scripts/ci/seed-dev.py

      - name: Point the app at pepla-dev
        run: scripts/ci/dev-frontend-env.sh

      - name: Load test logins (masked)
        run: python3 scripts/ci/load-e2e-logins.py

      - name: Install app and browser
        working-directory: hr-portal
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the app
        working-directory: hr-portal
        run: |
          npx ng serve --host 127.0.0.1 --port 4200 > /tmp/ng-serve.log 2>&1 &
          npx wait-on http://127.0.0.1:4200 --timeout 180000

      - name: Run journeys
        id: journeys
        working-directory: hr-portal
        env:
          E2E_BASE_URL: http://localhost:4200
          GREP: ${{ steps.pick.outputs.grep }}
        run: npx playwright test --config e2e/playwright.config.ts ${GREP:+--grep "$GREP"}

      # The new app: its acceptance tests that need a real sign-in, at desktop and phone.
      # Runs even when the old journeys failed, so one report shows both.
      # The new app is Angular 22, which needs Node 22; the current app above stays on 20.
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: "22"

      - name: Install new app and browser
        if: ${{ !cancelled() }}
        working-directory: pepla-web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the new app
        if: ${{ !cancelled() }}
        working-directory: pepla-web
        run: |
          npx ng serve --host 127.0.0.1 --port 4300 > /tmp/ng-serve-pepla-web.log 2>&1 &
          npx wait-on http://127.0.0.1:4300 --timeout 180000

      - name: Run new app acceptance tests
        id: acceptance
        if: ${{ !cancelled() }}
        working-directory: pepla-web
        env:
          ACCEPTANCE_TARGET: pepla-dev
          E2E_BASE_URL: http://127.0.0.1:4300
          CI: "true"
        run: npm run e2e:acceptance

      - name: Show the new app's server log
        if: failure()
        run: tail -n 60 /tmp/ng-serve-pepla-web.log || true

      - name: Clean up this run's records
        if: always()
        run: python3 scripts/ci/cleanup-dev-e2e.py

      # Failure pictures and videos show seeded fake people only. Short-lived.
      - name: Upload report
        id: report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e-dev-report-${{ github.run_id }}
          path: |
            hr-portal/e2e/e2e/reports/
            hr-portal/e2e/test-results/
            pepla-web/e2e/acceptance/.output/
          retention-days: 7
          if-no-files-found: ignore

      # One comment per PR, updated on each run: which journeys passed, how
      # long they took, and where the failure evidence is. On a push to
      # develop, a new comment goes on the PR that was merged.
      - name: Post results on the PR
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: actions/github-script@v7
        env:
          JOURNEYS_OUTCOME: ${{ steps.journeys.outcome }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          MODULES: ${{ steps.pick.outputs.modules }}
          FULL: ${{ inputs.full }}
        with:
          script: |
            const fs = require('fs');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const files = [
              ['hr-portal/e2e/results/results.json', process.env.JOURNEYS_OUTCOME, ''],
              ['pepla-web/e2e/acceptance/.output/results.json', process.env.ACCEPTANCE_OUTCOME, 'New app › '],
            ].filter(([f, o]) => fs.existsSync(f) && o && o !== 'skipped');
            const rows = [];
            const cards = [];
            const sizeOf = (project) => (project === 'phone-390' ? 'Phone' : 'Desktop');
            const walk = (suite, parents, isNew) => {
              const names = suite.title && !/\.(ts|js)$/.test(suite.title) ? [...parents, suite.title] : parents;
              for (const spec of suite.specs ?? []) {
                for (const t of spec.tests ?? []) {
                  const last = (t.results ?? []).at(-1) ?? {};
                  const tries = (t.results ?? []).length;
                  const icon = t.status === 'expected' ? (tries > 1 ? '🟡 passed on retry' : '✅ passed')
                    : t.status === 'skipped' ? '⚪ skipped' : '❌ failed';
                  rows.push({
                    group: names.join(' › '),
                    title: spec.title.replace(/\s*@pepla-dev\b/g, '').trim(),
                    size: isNew ? sizeOf(t.projectName) : 'Desktop',
                    icon, secs: ((last.duration ?? 0) / 1000).toFixed(1), failed: t.status === 'unexpected',
                  });
                  // The card id is the first word of the top-level describe, e.g. ONB-01.
                  const card = names[0]?.split(' ')[0];
                  if (isNew && card && !cards.includes(card)) cards.push(card);
                }
              }
              for (const child of suite.suites ?? []) walk(child, names, isNew);
            };
            let body;
            if (files.length) {
              let ms = 0;
              for (const [file, , prefix] of files) {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                const before = rows.length;
                for (const s of data.suites ?? []) walk(s, [], prefix !== '');
                for (const r of rows.slice(before)) r.group = prefix + r.group;
                ms += data.stats?.duration ?? 0;
              }
              const failed = rows.filter(r => r.failed).length;
              const took = ms < 60000 ? `${Math.round(ms / 1000)} s` : `${(ms / 60000).toFixed(1)} min`;
              const head = failed ? `❌ **${failed} of ${rows.length} tests failed** on pepla-dev (${took})`
                : `✅ **All ${rows.length} tests passed** on pepla-dev (${took})`;
              const table = ['| Journey | Test | Size | Result | Time |', '| --- | --- | --- | --- | --- |',
                ...rows.map(r => `| ${r.group} | ${r.title} | ${r.size} | ${r.icon} | ${r.secs}s |`)].join('\n');
              const evidence = failed && process.env.REPORT_URL
                ? `\n\nScreenshots, videos and traces of the failures (kept 7 days): ${process.env.REPORT_URL}` : '';
              const modules = process.env.MODULES || 'all journeys';
              const currentLine = process.env.FULL === 'true'
                ? '- Current app: all journeys, because this commit deployed Lambda code to pepla-dev.'
                : `- Current app: ${modules}, picked from the files this change touched.`;
              const newLine = cards.length
                ? `- New app: every test that needs pepla-dev (${cards.join(', ')}), at desktop and phone.`
                : '- New app: did not run.';
              const ran = `\n\nRan:\n${currentLine}\n${newLine}\nFull run every Monday.`;
              body = `${head}${ran}\n\n${table}${evidence}\n\nTest logins are robots and AI calls are blocked, so this run cost nothing in AI. [Run log](${run})`;
            } else {
              body = `⚠️ **The tests did not run**: a setup step failed before the tests started. [Run log](${run})`;
            }
            const when = context.eventName === 'pull_request' ? 'before merge' : 'after merge into develop';
            const marker = `<!-- app-e2e-dev:${context.eventName} -->`;
            body = `${marker}\n### App tests on pepla-dev, ${when}\n\n${body}`;
            let pr = context.payload.pull_request?.number;
            if (!pr) {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: context.sha });
              pr = prs.find(p => p.merged_at)?.number;
            }
            if (!pr) { core.info('No PR for this commit; nothing to comment on.'); return; }
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr, per_page: 100 });
            const mine = comments.find(c => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
