# ---------------------------------------------------------------------------
# CI — TalentFlow MVP1
#
# Runs on every PR and every push to main.
#
# Jobs:
#   1. frontend          — Node 20, ng build (prod), unit tests
#   2. validate-terraform — tf fmt -check + tf validate on talent-flow-infra/
#   3. e2e               — Playwright, ChromeHeadless (if E2E_ENABLED == 'true')
#
# Gate-only: no terraform plan or apply in CI. All infra changes are applied
# manually via `terraform apply` from a dev machine. This matches the Naleko
# CI pattern and avoids maintaining an ever-growing deploy-role permission list.
# ---------------------------------------------------------------------------

name: TalentFlow CI/CD

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "hr-portal/**"
      - "talent-flow-infra/**"
      - ".github/workflows/talent-flow-ci.yml"
  push:
    branches: [main]
    paths:
      - "hr-portal/**"
      - "talent-flow-infra/**"
      - ".github/workflows/talent-flow-ci.yml"

concurrency:
  group: talent-flow-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  TF_VERSION: "1.10.5"
  AWS_REGION: "af-south-1"
  WORKING_DIR_TF: "talent-flow-infra"
  WORKING_DIR_FE: "hr-portal"

# ---------------------------------------------------------------------------
# Job 1 — Angular frontend build + unit tests
# ---------------------------------------------------------------------------
jobs:
  frontend:
    name: Frontend — build & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR_FE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hr-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build -- --configuration production

      - name: Unit tests
        run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadless

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: talent-flow-dist
          path: hr-portal/dist/
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Job 2 — Terraform fmt check + validate (no AWS credentials needed)
  # ---------------------------------------------------------------------------
  validate-terraform:
    name: Terraform — fmt & validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR_TF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend — validate only)
        run: |
          terraform init \
            -backend=false \
            -input=false

      - name: Terraform validate
        run: terraform validate

  # ---------------------------------------------------------------------------
  # Job 3 — Playwright E2E tests
  # Runs only when vars.E2E_ENABLED == 'true'.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E — Playwright journeys
    runs-on: ubuntu-latest
    if: vars.E2E_ENABLED == 'true'
    needs: [frontend]

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR_FE }}

    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || '' }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_AGENT_API_KEY: ${{ secrets.E2E_AGENT_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hr-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start dev server (local mode — when no E2E_BASE_URL set)
        if: ${{ !vars.E2E_BASE_URL }}
        run: |
          npx ng serve --host 0.0.0.0 --port 4200 &
          npx wait-on http://localhost:4200 --timeout 120000

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talent-flow-playwright-report
          path: hr-portal/e2e/reports/
          retention-days: 14
