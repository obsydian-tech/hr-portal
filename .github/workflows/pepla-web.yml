# Gate for the new Pepla app in pepla-web/. Builds, tests and journeys only; deploys nothing and calls no AI service.
name: Pepla web

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "pepla-web/**"
      - ".github/workflows/pepla-web.yml"
      # Read or run by the BE-16 acceptance checks.
      - "infra/cognito.tf"
      - "infra/cognito-group-imports.tf"
      - "scripts/ci/seed-dev.py"
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/drift-check.yml"
  push:
    branches: [develop, main]
    paths:
      - "pepla-web/**"
      - ".github/workflows/pepla-web.yml"
      # Read or run by the BE-16 acceptance checks.
      - "infra/cognito.tf"
      - "infra/cognito-group-imports.tf"
      - "scripts/ci/seed-dev.py"
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/drift-check.yml"

concurrency:
  group: pepla-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: verify:design, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pepla-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pepla-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  journeys:
    name: Journeys (no backend)
    # Normal mode: checks the journeys, no help pictures. Help mode runs in
    # help-retake.yml after merges. Nothing here calls an AI service.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pepla-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pepla-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Failure pictures show the fake help company only. Short-lived.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pepla-web-journeys-${{ github.run_id }}
          path: pepla-web/e2e/.output/
          retention-days: 7
          if-no-files-found: ignore

  acceptance:
    name: Acceptance tests (no backend)
    # One test per acceptance criterion, at 1280 and 390 wide, with Cognito
    # faked in the browser. Locked once accepted (acceptance-lock.yml).
    # Nothing here calls an AI service.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pepla-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pepla-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # HELP-01 and later help cards run the help journeys and the retake script, which need these.
      - name: Install ffmpeg and ImageMagick
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg imagemagick
      - name: Run acceptance tests
        run: |
          if ls e2e/acceptance/*.spec.ts >/dev/null 2>&1; then npm run e2e:acceptance; else echo "No acceptance tests yet."; fi
      # Failure pictures show fake people only. Short-lived.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pepla-web-acceptance-${{ github.run_id }}
          path: pepla-web/e2e/acceptance/.output/
          retention-days: 7
          if-no-files-found: ignore
