# Gate for the new Pepla app in pepla-web/. Builds, tests and journeys only; deploys nothing and calls no AI service.
name: Pepla web

on:
  pull_request:
    branches: [develop, main]
    paths: ["pepla-web/**", ".github/workflows/pepla-web.yml"]
  push:
    branches: [develop, main]
    paths: ["pepla-web/**", ".github/workflows/pepla-web.yml"]

concurrency:
  group: pepla-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: verify:design, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pepla-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pepla-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  journeys:
    name: Journeys (no backend)
    # Normal mode: checks the journeys, no help pictures. Help mode runs in
    # help-retake.yml after merges. Nothing here calls an AI service.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pepla-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pepla-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Failure pictures show the fake help company only. Short-lived.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pepla-web-journeys-${{ github.run_id }}
          path: pepla-web/e2e/.output/
          retention-days: 7
          if-no-files-found: ignore
