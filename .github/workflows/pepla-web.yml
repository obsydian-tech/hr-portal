# Gate for the new Pepla app in pepla-web/. Builds, tests and journeys only; deploys nothing and calls no AI service.
name: Pepla web

on:
  # Nightly full run of every acceptance spec on develop (02:30 SAST). A merge into
  # develop no longer repeats the pull request's run (OPS-09).
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - "pepla-web/**"
      - "api/openapi.yaml"
      # Read or run by the infra acceptance checks (BE-16, OPS-05).
      - "infra/**"
      - "talent-flow-infra/**"
      - "bootstrap/**"
      - "scripts/ci/**"
      - ".github/workflows/**"
  push:
    branches: [develop, main]
    paths:
      - "pepla-web/**"
      - "api/openapi.yaml"
      # Read or run by the infra acceptance checks (BE-16, OPS-05).
      - "infra/**"
      - "talent-flow-infra/**"
      - "bootstrap/**"
      - "scripts/ci/**"
      - ".github/workflows/**"

concurrency:
  group: pepla-web-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  build:
    name: verify:design, tests, build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pepla-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pepla-web/package-lock.json
      - run: npm ci
      # REC-14: the app's types for the API come from api/openapi.yaml; a stale committed copy fails here.
      - name: Generated API types are current
        run: |
          npm run api:types
          git diff --exit-code src/app/core/api/openapi.d.ts
      - run: npm test
      - run: npm run build

  journeys:
    name: Journeys (no backend)
    if: github.event_name != 'schedule'
    # Normal mode: checks the journeys, no help pictures. Help mode runs in
    # help-retake.yml after merges. Nothing here calls an AI service.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pepla-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pepla-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Failure pictures show the fake help company only. Short-lived.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pepla-web-journeys-${{ github.run_id }}
          path: pepla-web/e2e/.output/
          retention-days: 7
          if-no-files-found: ignore

  plan:
    name: Pick acceptance specs
    # A pull request into develop runs the cards it can affect; nightly, by hand and
    # release pull requests run every spec; a push runs none (the pull request did).
    # scripts/ci/pick-acceptance-specs.py says why, in the job summary. Unsure = all.
    if: github.event_name != 'push'
    # Rule A (step 5): public site specs are left out of a pull request into develop that
    # touches nothing the site tests read. The nightly run and release pull requests run all.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read lets the job download the nightly timing file (read-only, falls back if refused)
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Picker tests
        run: |
          python3 -B scripts/ci/test_pick_acceptance_specs.py
          python3 -B scripts/ci/test_spec_seconds_from_results.py
      # The timing list only shares specs between the six groups, it never chooses which run.
      # The latest successful nightly run on develop keeps a fresh copy as an artifact. Any
      # failure here is ignored and the picker uses the committed list (it says so in the summary).
      - name: Fetch the nightly timing file
        id: timing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/timing"; mkdir -p "$dir"
          # The newest finished nightly runs, green or red: the timing job runs either way, so a
          # red night still has good numbers. Take the first of the last five that has the file.
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pepla-web.yml --branch develop --event schedule --status completed --limit 5 --json databaseId --jq '.[].databaseId') || { echo "No nightly run found."; exit 0; }
          for id in $ids; do
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n acceptance-spec-seconds -D "$dir" 2>/dev/null && [ -f "$dir/acceptance-spec-seconds.json" ]; then
              echo "Timing file from nightly run $id."
              echo "file=$dir/acceptance-spec-seconds.json" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No timing file on run $id."
          done
      - id: pick
        env:
          TIMING_FILE: ${{ steps.timing.outputs.file }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/ci/pick-acceptance-specs.py | tee -a "$GITHUB_OUTPUT"

  acceptance-shard:
    name: Acceptance shard ${{ matrix.shard }}/${{ matrix.of }}
    # One test per acceptance criterion, at 1280 and 390 wide, with Cognito
    # faked in the browser. Locked once accepted (acceptance-lock.yml).
    # Nothing here calls an AI service.
    needs: plan
    if: needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'selected'
    runs-on: ubuntu-latest
    # A shard of a full run takes about a quarter of the old single job (26 min on 15 Nov).
    # Site specs raised the longest shard to about 25 min (17 Nov). On 19 Nov slow runners
    # (setup alone took 11 to 18 min) pushed shards past 60 min and cancelled them, so the limit is 90.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: pepla-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pepla-web/package-lock.json
      - run: npm ci
      # TEN-02 AC-12 runs the shared Lambda code's own tests, which need their packages.
      - name: Install the shared Lambda code's packages
        working-directory: lambda/shared
        run: npm ci
      - run: npx playwright install --with-deps chromium
      # The help picture and video specs run the retake script, which needs these.
      - name: Install ffmpeg and ImageMagick
        if: matrix.media == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg imagemagick
      - name: Run acceptance tests
        env:
          SPECS: ${{ matrix.specs }}
          INFRA_ONLY: ${{ matrix.infra_only }}
        run: |
          # Specs that never open the app (infra checks) skip `ng serve`.
          if [ "$INFRA_ONLY" = true ]; then export E2E_BASE_URL=http://localhost:1; fi
          if ! ls e2e/acceptance/*.spec.ts >/dev/null 2>&1; then echo "No acceptance tests yet."; exit 0; fi
          # A failed test is run once more on its own (seconds), instead of the whole shard being
          # rerun by hand (10 to 25 minutes). The nightly run keeps 0 retries, so a test that only
          # passes on its second try shows up there. Retried tests are listed in the job summary.
          RETRIES=1
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then RETRIES=0; fi
          # shellcheck disable=SC2086
          npm run e2e:acceptance -- --retries=$RETRIES $SPECS
      - name: List tests that needed a retry
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          path = "e2e/acceptance/.output/results.json"
          if not os.path.exists(path):
              raise SystemExit
          flaky = []
          def walk(suite, trail):
              trail = trail + ([suite["title"]] if suite.get("title") else [])
              for spec in suite.get("specs", []):
                  for t in spec.get("tests", []):
                      if t.get("status") == "flaky":
                          errs = [r.get("error", {}).get("message", "").strip().splitlines()[:1] for r in t.get("results", []) if r.get("status") != "passed"]
                          flaky.append((t.get("projectName", ""), " > ".join(trail + [spec["title"]]), errs[0][0] if errs and errs[0] else ""))
              for sub in suite.get("suites", []):
                  walk(sub, trail)
          for top in json.load(open(path)).get("suites", []):
              walk(top, [])
          if flaky:
              print("### Passed only on a retry (flaky)")
              for project, title, err in flaky:
                  print(f"- `{project}` {title}: {err}")
                  print(f"::warning::Flaky, passed on retry: [{project}] {title}", file=__import__('sys').stderr)
          PY
      # Nightly only: this shard's seconds per spec, joined by the `timing` job below.
      - name: Add up this shard's seconds per spec
        if: always() && github.event_name == 'schedule'
        run: python3 ../scripts/ci/spec-seconds-from-results.py shard e2e/acceptance/.output/results.json spec-seconds-shard-${{ matrix.shard }}.json
      - name: Keep this shard's seconds
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: spec-seconds-shard-${{ matrix.shard }}
          path: pepla-web/spec-seconds-shard-${{ matrix.shard }}.json
          retention-days: 2
          if-no-files-found: ignore
      # Failure pictures show fake people only. Short-lived. include-hidden-files:
      # the output folder is .output, which the upload skipped before, so a failed run kept nothing.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pepla-web-acceptance-${{ matrix.shard }}-${{ github.run_id }}
          path: pepla-web/e2e/acceptance/.output/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore

  timing:
    # Nightly only: join the shards' seconds into one file that pull request runs read
    # (14 days). Nothing is committed; a failure here never fails the nightly run's result.
    name: Timing list from the nightly run
    needs: acceptance-shard
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          # Each group lands in its own folder (artifacts are not merged into one), and the join reads them all.
          pattern: spec-seconds-shard-*
          path: shards
      - run: python3 scripts/ci/spec-seconds-from-results.py merge shards acceptance-spec-seconds.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-spec-seconds
          path: acceptance-spec-seconds.json
          retention-days: 14
          if-no-files-found: ignore

  acceptance:
    # The name branch rules and Iggie already know. Green when every shard is green,
    # or when no spec was needed.
    name: Acceptance tests (no backend)
    needs: [plan, acceptance-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Judge the shards
        env:
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.acceptance-shard.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "event=$EVENT plan=$PLAN mode=$MODE shards=$SHARDS"
          if [ "$EVENT" = push ]; then echo "A merge does not repeat the pull request's run; the nightly run covers develop."; exit 0; fi
          [ "$PLAN" = success ] || { echo "::error::The spec picker did not finish"; exit 1; }
          case "$MODE" in
            none) echo "No acceptance spec reads this change."; exit 0 ;;
            full|selected) [ "$SHARDS" = success ] || { echo "::error::An acceptance shard failed or was cancelled"; exit 1; } ;;
            *) echo "::error::Unknown mode '$MODE'"; exit 1 ;;
          esac
